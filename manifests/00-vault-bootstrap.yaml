apiVersion: v1
kind: Secret
metadata:
  name: graphql-vault-bootstrap-token
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
type: Opaque
stringData:
  VAULT_TOKEN: "<path:secret/data/vaultadmin#value>"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: graphql-vault-bootstrap
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: graphql-vault-bootstrap
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: graphql-vault-bootstrap
      restartPolicy: Never
      volumes:
        - name: bootstrap-token
          secret:
            secretName: graphql-vault-bootstrap-token
      containers:
        - name: bootstrap
          image: hashicorp/vault:1.15.4
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_AUTH_PATH
              value: "kubernetes"
          volumeMounts:
            - name: bootstrap-token
              mountPath: /vault/bootstrap
              readOnly: true
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              TOKEN_FILE="/vault/bootstrap/VAULT_TOKEN"

              until [ -s "$TOKEN_FILE" ]; do
                echo "Waiting for bootstrap token at ${TOKEN_FILE}..."
                sleep 5
              done

              export VAULT_TOKEN
              VAULT_TOKEN="$(cat "$TOKEN_FILE")"

              until vault status >/dev/null 2>&1; do
                echo "Waiting for Vault at ${VAULT_ADDR}..."
                sleep 5
              done

              write_policy() {
                vault policy write graphql-vault-init - <<'EOF'
                path "sys/mounts" { capabilities = ["read"] }
                path "sys/mounts/*" { capabilities = ["create","read","update","delete","list"] }
                path "sys/policies/acl/*" { capabilities = ["create","read","update","delete","list"] }
                path "auth/kubernetes/role/*" { capabilities = ["create","read","update","delete","list"] }
                path "secret/data/graphql/*" { capabilities = ["create","read","update","delete","list"] }
                path "secret/data/vaultadmin" { capabilities = ["read"] }
                path "secret/data/yugabyte-su" { capabilities = ["read"] }
                path "yugabyte-db/*" { capabilities = ["create","read","update","delete","list"] }
                EOF
              }

              write_role() {
                vault write auth/${VAULT_AUTH_PATH}/role/graphql-vault-init \
                  bound_service_account_names="graphql-vault-init" \
                  bound_service_account_namespaces="vault" \
                  policies="graphql-vault-init" \
                  ttl="48h"
              }

              while :; do
                if write_policy && write_role; then
                  echo "Vault bootstrap complete."
                  break
                fi
                echo "Vault bootstrap failed; retrying in 5s."
                sleep 5
              done
