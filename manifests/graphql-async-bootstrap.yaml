apiVersion: batch/v1
kind: Job
metadata:
  name: graphql-async-bootstrap
  namespace: graphql
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
    argocd.argoproj.io/sync-wave: "2"
    reloader.stakater.com/auto: "true"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: graphql-async-bootstrap
      annotations:
        linkerd.io/inject: "disabled"
        reloader.stakater.com/auto: "true"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "graphql"
        vault.hashicorp.com/agent-inject-secret-hasura-admin: "secret/data/graphql/hasura-admin"
        vault.hashicorp.com/agent-inject-template-hasura-admin: |
          {{- with secret "secret/data/graphql/hasura-admin" -}}
          {{- if .Data.data.admin_secret -}}
          {{ .Data.data.admin_secret }}
          {{- else -}}
          {{ .Data.data.value }}
          {{- end -}}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-db-url: "yugabyte-db/static-creds/graphql-yb-admin"
        vault.hashicorp.com/agent-inject-template-db-url: |
          {{- with secret "yugabyte-db/static-creds/graphql-yb-admin" -}}
          postgresql://{{ .Data.username }}:{{ .Data.password }}@yb-tserver-service.yugabyte.svc.cluster.local:5433/hasura?sslmode=disable
          {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: hasura
      containers:
        - name: async-bootstrap
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: HASURA_URL
              value: "http://hasura.graphql.svc.cluster.local:8080"
            - name: ASYNC_REQUEST_ACTION_HANDLER_URL
              value: "http://graphql-async-request-publisher.graphql.svc.cluster.local:8080/action/publish_async_request"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail

              apk add --no-cache curl jq >/dev/null

              wait_for_file() {
                path="$1"
                while [ ! -s "$path" ]; do
                  echo "Waiting for $path..."
                  sleep 2
                done
              }

              metadata_post() {
                payload="$1"
                http_code="$(curl -sS -o /tmp/metadata-response.json -w '%{http_code}' \
                  -H 'Content-Type: application/json' \
                  -H "X-Hasura-Admin-Secret: ${HASURA_ADMIN_SECRET}" \
                  --data "$payload" \
                  "${HASURA_URL}/v1/metadata")"
                if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
                  echo "Hasura metadata request failed (HTTP ${http_code})" >&2
                  cat /tmp/metadata-response.json >&2 || true
                  exit 1
                fi
              }

              permission_exists() {
                role="$1"
                kind="$2"
                jq -e --arg source "${SOURCE_NAME}" --arg role "${role}" --arg kind "${kind}" '
                  .sources[]
                  | select(.name == $source)
                  | .tables[]?
                  | select(.table.schema == "graphql" and .table.name == "client_async_messages")
                  | (.[$kind] // [])[]?
                  | select(.role == $role)
                ' /tmp/metadata.json >/dev/null
              }

              action_exists() {
                action_name="$1"
                jq -e --arg action_name "${action_name}" '
                  (.actions // [])[]?
                  | select(.name == $action_name)
                ' /tmp/metadata.json >/dev/null
              }

              action_permission_exists() {
                action_name="$1"
                role="$2"
                jq -e --arg action_name "${action_name}" --arg role "${role}" '
                  (.actions // [])[]?
                  | select(.name == $action_name)
                  | (.permissions // [])[]?
                  | select(.role == $role)
                ' /tmp/metadata.json >/dev/null
              }

              custom_scalar_exists() {
                scalar_name="$1"
                jq -e --arg scalar_name "${scalar_name}" '
                  (.custom_types.scalars // [])[]?
                  | select(.name == $scalar_name)
                ' /tmp/metadata.json >/dev/null
              }

              wait_for_file /vault/secrets/db-url
              wait_for_file /vault/secrets/hasura-admin

              DB_URL="$(cat /vault/secrets/db-url)"
              HASURA_ADMIN_SECRET="$(cat /vault/secrets/hasura-admin)"

              until curl -fsS "${HASURA_URL}/healthz" >/dev/null; do
                echo "Waiting for Hasura at ${HASURA_URL}..."
                sleep 2
              done

              psql "${DB_URL}" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE SCHEMA IF NOT EXISTS graphql;

              CREATE TABLE IF NOT EXISTS graphql.client_async_messages (
                id BIGSERIAL PRIMARY KEY,
                request_id TEXT NOT NULL UNIQUE,
                client_id TEXT NOT NULL,
                status TEXT NOT NULL DEFAULT 'pending',
                request_payload JSONB,
                response_payload JSONB,
                error_payload JSONB,
                kafka_topic TEXT NOT NULL DEFAULT 'graphql.async.responses.v1',
                kafka_partition INTEGER,
                kafka_offset BIGINT,
                metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                completed_at TIMESTAMPTZ,
                expires_at TIMESTAMPTZ
              );

              CREATE INDEX IF NOT EXISTS client_async_messages_client_status_created_idx
                ON graphql.client_async_messages (client_id, status, created_at DESC);
              CREATE INDEX IF NOT EXISTS client_async_messages_status_created_idx
                ON graphql.client_async_messages (status, created_at);
              CREATE INDEX IF NOT EXISTS client_async_messages_request_id_idx
                ON graphql.client_async_messages (request_id);
              CREATE INDEX IF NOT EXISTS client_async_messages_expires_at_idx
                ON graphql.client_async_messages (expires_at);

              CREATE OR REPLACE FUNCTION graphql.set_updated_at()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$$$
              BEGIN
                NEW.updated_at = NOW();
                RETURN NEW;
              END;
              $$$$;

              DROP TRIGGER IF EXISTS tr_client_async_messages_set_updated_at ON graphql.client_async_messages;
              CREATE TRIGGER tr_client_async_messages_set_updated_at
              BEFORE UPDATE ON graphql.client_async_messages
              FOR EACH ROW
              EXECUTE FUNCTION graphql.set_updated_at();

              DO $$$$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'graphql_admin') THEN
                  GRANT USAGE ON SCHEMA graphql TO graphql_admin;
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE graphql.client_async_messages TO graphql_admin;
                  GRANT USAGE, SELECT, UPDATE ON SEQUENCE graphql.client_async_messages_id_seq TO graphql_admin;
                END IF;
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'graphql_ro') THEN
                  GRANT USAGE ON SCHEMA graphql TO graphql_ro;
                  GRANT SELECT ON TABLE graphql.client_async_messages TO graphql_ro;
                  GRANT USAGE, SELECT ON SEQUENCE graphql.client_async_messages_id_seq TO graphql_ro;
                END IF;
              END;
              $$$$;
              SQL

              curl -sS -H 'Content-Type: application/json' \
                -H "X-Hasura-Admin-Secret: ${HASURA_ADMIN_SECRET}" \
                --data '{"type":"export_metadata","args":{}}' \
                "${HASURA_URL}/v1/metadata" > /tmp/metadata.json

              SOURCE_NAME="$(jq -r '.sources[0].name // empty' /tmp/metadata.json)"
              if [ -z "${SOURCE_NAME}" ]; then
                echo "No Hasura source found to track graphql.client_async_messages" >&2
                exit 1
              fi

              if ! jq -e --arg source "${SOURCE_NAME}" '
                .sources[]
                | select(.name == $source)
                | .tables[]?
                | select(.table.schema == "graphql" and .table.name == "client_async_messages")
              ' /tmp/metadata.json >/dev/null; then
                TRACK_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" '{
                  type: "pg_track_table",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" }
                  }
                }')"
                metadata_post "${TRACK_PAYLOAD}"
              fi

              if ! permission_exists "user" "select_permissions"; then
                USER_SELECT_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" '{
                  type: "pg_create_select_permission",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" },
                    role: "user",
                    permission: {
                      columns: [
                        "id", "request_id", "client_id", "status", "request_payload", "response_payload",
                        "error_payload", "kafka_topic", "kafka_partition", "kafka_offset", "metadata",
                        "created_at", "updated_at", "completed_at", "expires_at"
                      ],
                      filter: { client_id: { _eq: "X-Hasura-User-Id" } },
                      allow_aggregations: true,
                      limit: 500
                    }
                  }
                }')"
                metadata_post "${USER_SELECT_PAYLOAD}"
              fi

              if ! permission_exists "user" "insert_permissions"; then
                USER_INSERT_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" '{
                  type: "pg_create_insert_permission",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" },
                    role: "user",
                    permission: {
                      columns: ["request_id", "client_id", "request_payload", "metadata", "kafka_topic", "expires_at"],
                      check: { client_id: { _eq: "X-Hasura-User-Id" } }
                    }
                  }
                }')"
                metadata_post "${USER_INSERT_PAYLOAD}"
              fi

              if ! permission_exists "service" "select_permissions"; then
                SERVICE_SELECT_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" '{
                  type: "pg_create_select_permission",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" },
                    role: "service",
                    permission: {
                      columns: [
                        "id", "request_id", "client_id", "status", "request_payload", "response_payload",
                        "error_payload", "kafka_topic", "kafka_partition", "kafka_offset", "metadata",
                        "created_at", "updated_at", "completed_at", "expires_at"
                      ],
                      filter: {},
                      allow_aggregations: true
                    }
                  }
                }')"
                metadata_post "${SERVICE_SELECT_PAYLOAD}"
              fi

              if ! permission_exists "service" "insert_permissions"; then
                SERVICE_INSERT_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" '{
                  type: "pg_create_insert_permission",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" },
                    role: "service",
                    permission: {
                      columns: [
                        "request_id", "client_id", "status", "request_payload", "response_payload", "error_payload",
                        "kafka_topic", "kafka_partition", "kafka_offset", "metadata", "completed_at", "expires_at"
                      ],
                      check: {}
                    }
                  }
                }')"
                metadata_post "${SERVICE_INSERT_PAYLOAD}"
              fi

              if ! permission_exists "service" "update_permissions"; then
                SERVICE_UPDATE_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" '{
                  type: "pg_create_update_permission",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" },
                    role: "service",
                    permission: {
                      columns: [
                        "status", "response_payload", "error_payload", "kafka_partition", "kafka_offset",
                        "metadata", "completed_at", "expires_at"
                      ],
                      filter: {},
                      check: {}
                    }
                  }
                }')"
                metadata_post "${SERVICE_UPDATE_PAYLOAD}"
              fi

              if ! custom_scalar_exists "json"; then
                SET_CUSTOM_TYPES_PAYLOAD="$(jq -n \
                  --argjson custom_types "$(jq '
                    (.custom_types // {})
                    | .scalars = (((.scalars // []) + [{"name":"json"}]) | unique_by(.name))
                  ' /tmp/metadata.json)" '{
                    type: "set_custom_types",
                    args: $custom_types
                  }')"
                metadata_post "${SET_CUSTOM_TYPES_PAYLOAD}"
              fi

              if ! action_exists "publish_async_request"; then
                CREATE_ACTION_PAYLOAD="$(jq -n \
                  --arg handler "${ASYNC_REQUEST_ACTION_HANDLER_URL}" '{
                    type: "create_action",
                    args: {
                      name: "publish_async_request",
                      definition: {
                        type: "mutation",
                        kind: "synchronous",
                        handler: $handler,
                        timeout: 30,
                        forward_client_headers: true,
                        arguments: [
                          { name: "input", type: "json!" }
                        ],
                        output_type: "json"
                      },
                      comment: "managed-by=graphql-async-bootstrap async-request-publisher"
                    }
                  }')"
                metadata_post "${CREATE_ACTION_PAYLOAD}"
              fi

              if ! action_permission_exists "publish_async_request" "user"; then
                CREATE_ACTION_PERMISSION_USER_PAYLOAD="$(jq -n '{
                  type: "create_action_permission",
                  args: {
                    action: "publish_async_request",
                    role: "user",
                    comment: "managed-by=graphql-async-bootstrap async-request-publisher"
                  }
                }')"
                metadata_post "${CREATE_ACTION_PERMISSION_USER_PAYLOAD}"
              fi

              if ! action_permission_exists "publish_async_request" "service"; then
                CREATE_ACTION_PERMISSION_SERVICE_PAYLOAD="$(jq -n '{
                  type: "create_action_permission",
                  args: {
                    action: "publish_async_request",
                    role: "service",
                    comment: "managed-by=graphql-async-bootstrap async-request-publisher"
                  }
                }')"
                metadata_post "${CREATE_ACTION_PERMISSION_SERVICE_PAYLOAD}"
              fi

              echo "graphql.client_async_messages bootstrap complete"
