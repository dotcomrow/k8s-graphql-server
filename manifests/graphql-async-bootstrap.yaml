apiVersion: batch/v1
kind: Job
metadata:
  name: graphql-async-bootstrap
  namespace: graphql
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
    argocd.argoproj.io/sync-wave: "2"
    reloader.stakater.com/auto: "true"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: graphql-async-bootstrap
      annotations:
        linkerd.io/inject: "disabled"
        reloader.stakater.com/auto: "true"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "graphql"
        vault.hashicorp.com/agent-inject-secret-hasura-admin: "secret/data/graphql/hasura-admin"
        vault.hashicorp.com/agent-inject-template-hasura-admin: |
          {{- with secret "secret/data/graphql/hasura-admin" -}}
          {{- if .Data.data.admin_secret -}}
          {{ .Data.data.admin_secret }}
          {{- else -}}
          {{ .Data.data.value }}
          {{- end -}}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-db-url: "yugabyte-db/static-creds/graphql-yb-admin"
        vault.hashicorp.com/agent-inject-template-db-url: |
          {{- with secret "yugabyte-db/static-creds/graphql-yb-admin" -}}
          postgresql://{{ .Data.username }}:{{ .Data.password }}@yb-tserver-service.yugabyte.svc.cluster.local:5433/hasura?sslmode=disable
          {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: hasura
      containers:
        - name: async-bootstrap
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: HASURA_URL
              value: "http://hasura.graphql.svc.cluster.local:8080"
            - name: ASYNC_REQUEST_ACTION_HANDLER_URL
              value: "http://graphql-async-request-publisher.graphql.svc.cluster.local:8080/action/publish_async_request"
            - name: ASYNC_CANCEL_ACTION_HANDLER_URL
              value: "http://graphql-async-request-publisher.graphql.svc.cluster.local:8080/action/cancel_async_operation"
            - name: ASYNC_RETRY_ACTION_HANDLER_URL
              value: "http://graphql-async-request-publisher.graphql.svc.cluster.local:8080/action/retry_async_operation"
            - name: ASYNC_CLIENT_ROLE
              value: "user"
            - name: ASYNC_SERVICE_ROLE
              value: "service"
            - name: ASYNC_REQUEST_ACTION_ROLES
              value: "user,service"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail

              apk add --no-cache curl jq >/dev/null

              wait_for_file() {
                path="$1"
                while [ ! -s "$path" ]; do
                  echo "Waiting for $path..."
                  sleep 2
                done
              }

              metadata_post() {
                payload="$1"
                http_code="$(curl -sS -o /tmp/metadata-response.json -w '%{http_code}' \
                  -H 'Content-Type: application/json' \
                  -H "X-Hasura-Admin-Secret: ${HASURA_ADMIN_SECRET}" \
                  --data "$payload" \
                  "${HASURA_URL}/v1/metadata")"
                if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
                  echo "Hasura metadata request failed (HTTP ${http_code})" >&2
                  cat /tmp/metadata-response.json >&2 || true
                  exit 1
                fi
              }

              permission_exists() {
                role="$1"
                kind="$2"
                jq -e --arg source "${SOURCE_NAME}" --arg role "${role}" --arg kind "${kind}" '
                  .sources[]
                  | select(.name == $source)
                  | .tables[]?
                  | select(.table.schema == "graphql" and .table.name == "client_async_messages")
                  | (.[$kind] // [])[]?
                  | select(.role == $role)
                ' /tmp/metadata.json >/dev/null
              }

              action_exists() {
                action_name="$1"
                jq -e --arg action_name "${action_name}" '
                  (.actions // [])[]?
                  | select(.name == $action_name)
                ' /tmp/metadata.json >/dev/null
              }

              action_permission_exists() {
                action_name="$1"
                role="$2"
                jq -e --arg action_name "${action_name}" --arg role "${role}" '
                  (.actions // [])[]?
                  | select(.name == $action_name)
                  | (.permissions // [])[]?
                  | select(.role == $role)
                ' /tmp/metadata.json >/dev/null
              }

              custom_scalar_exists() {
                scalar_name="$1"
                jq -e --arg scalar_name "${scalar_name}" '
                  (.custom_types.scalars // [])[]?
                  | select(.name == $scalar_name)
                ' /tmp/metadata.json >/dev/null
              }

              wait_for_file /vault/secrets/db-url
              wait_for_file /vault/secrets/hasura-admin

              DB_URL="$(cat /vault/secrets/db-url)"
              HASURA_ADMIN_SECRET="$(cat /vault/secrets/hasura-admin)"

              until curl -fsS "${HASURA_URL}/healthz" >/dev/null; do
                echo "Waiting for Hasura at ${HASURA_URL}..."
                sleep 2
              done

              psql "${DB_URL}" -v ON_ERROR_STOP=1 <<'SQL'
              CREATE SCHEMA IF NOT EXISTS graphql;

              CREATE TABLE IF NOT EXISTS graphql.client_async_messages (
                id BIGSERIAL PRIMARY KEY,
                request_id TEXT NOT NULL UNIQUE,
                client_id TEXT NOT NULL,
                status TEXT NOT NULL DEFAULT 'pending',
                request_payload JSONB,
                response_payload JSONB,
                error_payload JSONB,
                kafka_topic TEXT NOT NULL DEFAULT 'graphql.async.responses.v1',
                kafka_partition INTEGER,
                kafka_offset BIGINT,
                metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                completed_at TIMESTAMPTZ,
                expires_at TIMESTAMPTZ
              );

              ALTER TABLE graphql.client_async_messages
                ADD COLUMN IF NOT EXISTS operation_type TEXT,
                ADD COLUMN IF NOT EXISTS operation_version TEXT,
                ADD COLUMN IF NOT EXISTS handler TEXT,
                ADD COLUMN IF NOT EXISTS operation TEXT,
                ADD COLUMN IF NOT EXISTS priority TEXT NOT NULL DEFAULT 'normal',
                ADD COLUMN IF NOT EXISTS not_before TIMESTAMPTZ,
                ADD COLUMN IF NOT EXISTS request_kafka_topic TEXT NOT NULL DEFAULT 'graphql.async.requests.v1',
                ADD COLUMN IF NOT EXISTS request_kafka_partition INTEGER,
                ADD COLUMN IF NOT EXISTS request_kafka_offset BIGINT,
                ADD COLUMN IF NOT EXISTS attempt_count INTEGER NOT NULL DEFAULT 0,
                ADD COLUMN IF NOT EXISTS max_attempts INTEGER NOT NULL DEFAULT 1,
                ADD COLUMN IF NOT EXISTS cancel_requested_at TIMESTAMPTZ,
                ADD COLUMN IF NOT EXISTS leased_at TIMESTAMPTZ,
                ADD COLUMN IF NOT EXISTS started_at TIMESTAMPTZ,
                ADD COLUMN IF NOT EXISTS next_attempt_at TIMESTAMPTZ;

              CREATE TABLE IF NOT EXISTS graphql.async_operation_outbox (
                id BIGSERIAL PRIMARY KEY,
                request_id TEXT NOT NULL REFERENCES graphql.client_async_messages(request_id) ON DELETE CASCADE,
                event_type TEXT NOT NULL DEFAULT 'operation.requested',
                kafka_topic TEXT NOT NULL,
                message_key TEXT NOT NULL,
                payload JSONB NOT NULL,
                available_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                publish_attempts INTEGER NOT NULL DEFAULT 0,
                max_publish_attempts INTEGER NOT NULL DEFAULT 20,
                locked_at TIMESTAMPTZ,
                locked_by TEXT,
                published_at TIMESTAMPTZ,
                kafka_partition INTEGER,
                kafka_offset BIGINT,
                last_error TEXT,
                created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );

              CREATE INDEX IF NOT EXISTS client_async_messages_client_status_created_idx
                ON graphql.client_async_messages (client_id, status, created_at DESC);
              CREATE INDEX IF NOT EXISTS client_async_messages_status_created_idx
                ON graphql.client_async_messages (status, created_at);
              CREATE INDEX IF NOT EXISTS client_async_messages_request_id_idx
                ON graphql.client_async_messages (request_id);
              CREATE INDEX IF NOT EXISTS client_async_messages_expires_at_idx
                ON graphql.client_async_messages (expires_at);
              CREATE INDEX IF NOT EXISTS client_async_messages_handler_status_idx
                ON graphql.client_async_messages (handler, status, priority, created_at);
              CREATE INDEX IF NOT EXISTS async_operation_outbox_ready_idx
                ON graphql.async_operation_outbox (available_at, id)
                WHERE published_at IS NULL;
              CREATE INDEX IF NOT EXISTS async_operation_outbox_request_idx
                ON graphql.async_operation_outbox (request_id, id DESC);

              CREATE OR REPLACE FUNCTION graphql.set_updated_at()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$$$
              BEGIN
                NEW.updated_at = NOW();
                RETURN NEW;
              END;
              $$$$;

              DROP TRIGGER IF EXISTS tr_client_async_messages_set_updated_at ON graphql.client_async_messages;
              CREATE TRIGGER tr_client_async_messages_set_updated_at
              BEFORE UPDATE ON graphql.client_async_messages
              FOR EACH ROW
              EXECUTE FUNCTION graphql.set_updated_at();

              DROP TRIGGER IF EXISTS tr_async_operation_outbox_set_updated_at ON graphql.async_operation_outbox;
              CREATE TRIGGER tr_async_operation_outbox_set_updated_at
              BEFORE UPDATE ON graphql.async_operation_outbox
              FOR EACH ROW
              EXECUTE FUNCTION graphql.set_updated_at();

              DO $$$$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'graphql_admin') THEN
                  GRANT USAGE ON SCHEMA graphql TO graphql_admin;
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE graphql.client_async_messages TO graphql_admin;
                  GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE graphql.async_operation_outbox TO graphql_admin;
                  GRANT USAGE, SELECT, UPDATE ON SEQUENCE graphql.client_async_messages_id_seq TO graphql_admin;
                  GRANT USAGE, SELECT, UPDATE ON SEQUENCE graphql.async_operation_outbox_id_seq TO graphql_admin;
                END IF;
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'graphql_ro') THEN
                  GRANT USAGE ON SCHEMA graphql TO graphql_ro;
                  REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER
                    ON TABLE graphql.client_async_messages
                    FROM graphql_ro;
                  GRANT SELECT ON TABLE graphql.client_async_messages TO graphql_ro;
                  REVOKE UPDATE, USAGE ON SEQUENCE graphql.client_async_messages_id_seq FROM graphql_ro;
                  GRANT SELECT ON SEQUENCE graphql.client_async_messages_id_seq TO graphql_ro;
                END IF;
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'graphql_operation_test_worker_ro') THEN
                  GRANT USAGE ON SCHEMA graphql TO graphql_operation_test_worker_ro;
                  REVOKE ALL PRIVILEGES ON TABLE graphql.client_async_messages FROM graphql_operation_test_worker_ro;
                  GRANT SELECT (request_id, status, cancel_requested_at)
                    ON TABLE graphql.client_async_messages
                    TO graphql_operation_test_worker_ro;
                END IF;
              END;
              $$$$;
              SQL

              curl -sS -H 'Content-Type: application/json' \
                -H "X-Hasura-Admin-Secret: ${HASURA_ADMIN_SECRET}" \
                --data '{"type":"export_metadata","args":{}}' \
                "${HASURA_URL}/v1/metadata" > /tmp/metadata.json

              SOURCE_NAME="$(jq -r '.sources[0].name // empty' /tmp/metadata.json)"
              if [ -z "${SOURCE_NAME}" ]; then
                echo "No Hasura source found to track graphql.client_async_messages" >&2
                exit 1
              fi

              if ! jq -e --arg source "${SOURCE_NAME}" '
                .sources[]
                | select(.name == $source)
                | .tables[]?
                | select(.table.schema == "graphql" and .table.name == "client_async_messages")
              ' /tmp/metadata.json >/dev/null; then
                TRACK_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" '{
                  type: "pg_track_table",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" }
                  }
                }')"
                metadata_post "${TRACK_PAYLOAD}"
              fi

              if permission_exists "${ASYNC_CLIENT_ROLE}" "select_permissions"; then
                USER_DROP_SELECT_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" --arg role "${ASYNC_CLIENT_ROLE}" '{
                  type: "pg_drop_select_permission",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" },
                    role: $role
                  }
                }')"
                metadata_post "${USER_DROP_SELECT_PAYLOAD}"
              fi

              USER_SELECT_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" --arg role "${ASYNC_CLIENT_ROLE}" '{
                type: "pg_create_select_permission",
                args: {
                  source: $source,
                  table: { schema: "graphql", name: "client_async_messages" },
                  role: $role,
                  permission: {
                    columns: [
                      "id", "request_id", "client_id", "status", "request_payload", "response_payload",
                      "error_payload", "metadata",
                      "created_at", "updated_at", "completed_at", "expires_at", "operation_type",
                      "operation_version", "priority", "not_before",
                      "attempt_count", "max_attempts", "cancel_requested_at", "leased_at", "started_at",
                      "next_attempt_at"
                    ],
                    filter: { client_id: { _eq: "X-Hasura-User-Id" } },
                    allow_aggregations: true,
                    limit: 500,
                    query_root_fields: ["select", "select_by_pk", "select_aggregate"],
                    subscription_root_fields: ["select", "select_by_pk", "select_aggregate"]
                  }
                }
              }')"
              metadata_post "${USER_SELECT_PAYLOAD}"

              if permission_exists "${ASYNC_CLIENT_ROLE}" "insert_permissions"; then
                USER_DROP_INSERT_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" --arg role "${ASYNC_CLIENT_ROLE}" '{
                  type: "pg_drop_insert_permission",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" },
                    role: $role
                  }
                }')"
                metadata_post "${USER_DROP_INSERT_PAYLOAD}"
              fi

              if permission_exists "${ASYNC_SERVICE_ROLE}" "select_permissions"; then
                SERVICE_DROP_SELECT_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" --arg role "${ASYNC_SERVICE_ROLE}" '{
                  type: "pg_drop_select_permission",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" },
                    role: $role
                  }
                }')"
                metadata_post "${SERVICE_DROP_SELECT_PAYLOAD}"
              fi

              SERVICE_SELECT_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" --arg role "${ASYNC_SERVICE_ROLE}" '{
                type: "pg_create_select_permission",
                args: {
                  source: $source,
                  table: { schema: "graphql", name: "client_async_messages" },
                  role: $role,
                  permission: {
                    columns: [
                      "id", "request_id", "client_id", "status", "request_payload", "response_payload",
                      "error_payload", "kafka_topic", "kafka_partition", "kafka_offset", "metadata",
                      "created_at", "updated_at", "completed_at", "expires_at", "operation_type",
                      "operation_version", "handler", "operation", "priority", "not_before",
                      "request_kafka_topic", "request_kafka_partition", "request_kafka_offset",
                      "attempt_count", "max_attempts", "cancel_requested_at", "leased_at", "started_at",
                      "next_attempt_at"
                    ],
                    filter: {},
                    allow_aggregations: true,
                    query_root_fields: ["select", "select_by_pk", "select_aggregate"],
                    subscription_root_fields: ["select", "select_by_pk", "select_aggregate"]
                  }
                }
              }')"
              metadata_post "${SERVICE_SELECT_PAYLOAD}"

              if ! permission_exists "${ASYNC_SERVICE_ROLE}" "insert_permissions"; then
                SERVICE_INSERT_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" --arg role "${ASYNC_SERVICE_ROLE}" '{
                  type: "pg_create_insert_permission",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" },
                    role: $role,
                    permission: {
                      columns: [
                        "request_id", "client_id", "status", "request_payload", "response_payload", "error_payload",
                        "kafka_topic", "kafka_partition", "kafka_offset", "metadata", "completed_at", "expires_at"
                      ],
                      check: {}
                    }
                  }
                }')"
                metadata_post "${SERVICE_INSERT_PAYLOAD}"
              fi

              if ! permission_exists "${ASYNC_SERVICE_ROLE}" "update_permissions"; then
                SERVICE_UPDATE_PAYLOAD="$(jq -n --arg source "${SOURCE_NAME}" --arg role "${ASYNC_SERVICE_ROLE}" '{
                  type: "pg_create_update_permission",
                  args: {
                    source: $source,
                    table: { schema: "graphql", name: "client_async_messages" },
                    role: $role,
                    permission: {
                      columns: [
                        "status", "response_payload", "error_payload", "kafka_partition", "kafka_offset",
                        "metadata", "completed_at", "expires_at", "attempt_count", "cancel_requested_at",
                        "leased_at", "started_at", "next_attempt_at"
                      ],
                      filter: {},
                      check: {}
                    }
                  }
                }')"
                metadata_post "${SERVICE_UPDATE_PAYLOAD}"
              fi

              if ! custom_scalar_exists "json"; then
                SET_CUSTOM_TYPES_PAYLOAD="$(jq -n \
                  --argjson custom_types "$(jq '
                    (.custom_types // {})
                    | .scalars = (((.scalars // []) + [{"name":"json"}]) | unique_by(.name))
                  ' /tmp/metadata.json)" '{
                    type: "set_custom_types",
                    args: $custom_types
                  }')"
                metadata_post "${SET_CUSTOM_TYPES_PAYLOAD}"
              fi

              if ! action_exists "publish_async_request"; then
                CREATE_ACTION_PAYLOAD="$(jq -n \
                  --arg handler "${ASYNC_REQUEST_ACTION_HANDLER_URL}" '{
                    type: "create_action",
                    args: {
                      name: "publish_async_request",
                      definition: {
                        type: "mutation",
                        kind: "synchronous",
                        handler: $handler,
                        timeout: 30,
                        forward_client_headers: true,
                        arguments: [
                          { name: "input", type: "json!" }
                        ],
                        output_type: "json"
                      },
                      comment: "managed-by=graphql-async-bootstrap async-request-publisher"
                    }
                  }')"
                metadata_post "${CREATE_ACTION_PAYLOAD}"
              fi

              if ! action_exists "cancel_async_operation"; then
                CREATE_CANCEL_ACTION_PAYLOAD="$(jq -n \
                  --arg handler "${ASYNC_CANCEL_ACTION_HANDLER_URL}" '{
                    type: "create_action",
                    args: {
                      name: "cancel_async_operation",
                      definition: {
                        type: "mutation",
                        kind: "synchronous",
                        handler: $handler,
                        timeout: 30,
                        forward_client_headers: true,
                        arguments: [{ name: "input", type: "json!" }],
                        output_type: "json"
                      },
                      comment: "managed-by=graphql-async-bootstrap generic-operation-control"
                    }
                  }')"
                metadata_post "${CREATE_CANCEL_ACTION_PAYLOAD}"
              fi

              if ! action_exists "retry_async_operation"; then
                CREATE_RETRY_ACTION_PAYLOAD="$(jq -n \
                  --arg handler "${ASYNC_RETRY_ACTION_HANDLER_URL}" '{
                    type: "create_action",
                    args: {
                      name: "retry_async_operation",
                      definition: {
                        type: "mutation",
                        kind: "synchronous",
                        handler: $handler,
                        timeout: 30,
                        forward_client_headers: true,
                        arguments: [{ name: "input", type: "json!" }],
                        output_type: "json"
                      },
                      comment: "managed-by=graphql-async-bootstrap generic-operation-control"
                    }
                  }')"
                metadata_post "${CREATE_RETRY_ACTION_PAYLOAD}"
              fi

              ACTION_ROLES_CSV="$(printf '%s' "${ASYNC_REQUEST_ACTION_ROLES:-${ASYNC_CLIENT_ROLE},${ASYNC_SERVICE_ROLE}}" | tr -d '[:space:]')"
              if [ -n "${ACTION_ROLES_CSV}" ]; then
                PREV_IFS="${IFS}"
                IFS=','
                for role in ${ACTION_ROLES_CSV}; do
                  if [ -z "${role}" ]; then
                    continue
                  fi
                  if ! action_permission_exists "publish_async_request" "${role}"; then
                    CREATE_ACTION_PERMISSION_PAYLOAD="$(jq -n --arg role "${role}" '{
                      type: "create_action_permission",
                      args: {
                        action: "publish_async_request",
                        role: $role,
                        comment: "managed-by=graphql-async-bootstrap async-request-publisher"
                      }
                    }')"
                    metadata_post "${CREATE_ACTION_PERMISSION_PAYLOAD}"
                  fi
                  for control_action in cancel_async_operation retry_async_operation; do
                    if ! action_permission_exists "${control_action}" "${role}"; then
                      CREATE_CONTROL_PERMISSION_PAYLOAD="$(jq -n --arg role "${role}" --arg action "${control_action}" '{
                        type: "create_action_permission",
                        args: {
                          action: $action,
                          role: $role,
                          comment: "managed-by=graphql-async-bootstrap generic-operation-control"
                        }
                      }')"
                      metadata_post "${CREATE_CONTROL_PERMISSION_PAYLOAD}"
                    fi
                  done
                done
                IFS="${PREV_IFS}"
              fi

              echo "graphql.client_async_messages bootstrap complete"
