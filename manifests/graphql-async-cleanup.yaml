apiVersion: v1
kind: ServiceAccount
metadata:
  name: graphql-async-cleanup
  namespace: graphql
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: graphql-async-cleanup
  namespace: graphql
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    reloader.stakater.com/auto: "true"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app: graphql-async-cleanup
          annotations:
            linkerd.io/inject: "disabled"
            reloader.stakater.com/auto: "true"
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/role: "graphql-async-cleanup"
            vault.hashicorp.com/agent-inject-secret-db-url: "yugabyte-db/static-creds/graphql-yb-admin"
            vault.hashicorp.com/agent-inject-template-db-url: |
              {{- with secret "yugabyte-db/static-creds/graphql-yb-admin" -}}
              postgresql://{{ .Data.username }}:{{ .Data.password }}@yb-tserver-service.yugabyte.svc.cluster.local:5433/hasura?sslmode=disable
              {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: graphql-async-cleanup
          containers:
            - name: cleanup
              image: postgres:15-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: CLEANUP_BATCH_SIZE
                  value: "1000"
                - name: CLEANUP_MAX_BATCHES
                  value: "100"
                - name: CLEANUP_DB_RETRY_ATTEMPTS
                  value: "8"
                - name: CLEANUP_DB_RETRY_DELAY_SECONDS
                  value: "5"
                - name: CLEANUP_DB_CONNECT_TIMEOUT_SECONDS
                  value: "5"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail

                  wait_for_file() {
                    path="$1"
                    while [ ! -s "$path" ]; do
                      echo "Waiting for $path..."
                      sleep 2
                    done
                  }

                  psql_with_retry() {
                    query="$1"
                    attempt=1
                    max_attempts="${CLEANUP_DB_RETRY_ATTEMPTS:-8}"
                    retry_delay="${CLEANUP_DB_RETRY_DELAY_SECONDS:-5}"

                    while true; do
                      if query_output="$(psql "${DB_URL}" -v ON_ERROR_STOP=1 -tA -c "${query}" 2>&1)"; then
                        printf '%s' "${query_output}"
                        return 0
                      fi

                      if [ "${attempt}" -ge "${max_attempts}" ]; then
                        echo "psql failed after ${attempt}/${max_attempts} attempts for query:" >&2
                        echo "${query}" >&2
                        echo "${query_output}" >&2
                        return 1
                      fi

                      echo "psql attempt ${attempt}/${max_attempts} failed; retrying in ${retry_delay}s" >&2
                      echo "${query_output}" >&2
                      attempt=$((attempt + 1))
                      sleep "${retry_delay}"
                    done
                  }

                  wait_for_file /vault/secrets/db-url
                  export PGCONNECT_TIMEOUT="${CLEANUP_DB_CONNECT_TIMEOUT_SECONDS:-5}"
                  DB_URL="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' /vault/secrets/db-url)"

                  table_exists="$(psql_with_retry "SELECT to_regclass('graphql.client_async_messages') IS NOT NULL;")"
                  table_exists="$(echo "${table_exists}" | tr -d '[:space:]')"
                  if [ "${table_exists}" != "t" ]; then
                    echo "graphql.client_async_messages not found; skipping cleanup"
                    exit 0
                  fi

                  batch_size="${CLEANUP_BATCH_SIZE:-1000}"
                  max_batches="${CLEANUP_MAX_BATCHES:-100}"
                  total_deleted=0
                  batch_num=0

                  while [ "${batch_num}" -lt "${max_batches}" ]; do
                    delete_expired_sql="WITH doomed AS (
                      SELECT id
                      FROM graphql.client_async_messages
                      WHERE expires_at IS NOT NULL
                        AND expires_at < NOW()
                      ORDER BY expires_at, id
                      LIMIT ${batch_size}
                    ),
                    deleted AS (
                      DELETE FROM graphql.client_async_messages AS m
                      USING doomed
                      WHERE m.id = doomed.id
                      RETURNING 1
                    )
                    SELECT COUNT(*) FROM deleted;"
                    deleted="$(psql_with_retry "${delete_expired_sql}")"
                    deleted="$(echo "${deleted:-0}" | tr -d '[:space:]')"
                    if [ -z "${deleted}" ]; then
                      deleted=0
                    fi

                    total_deleted=$((total_deleted + deleted))
                    batch_num=$((batch_num + 1))

                    if [ "${deleted}" -lt "${batch_size}" ]; then
                      break
                    fi
                  done

                  echo "Deleted ${total_deleted} expired row(s) from graphql.client_async_messages in ${batch_num} batch(es)"
