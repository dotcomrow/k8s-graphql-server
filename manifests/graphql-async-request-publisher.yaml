apiVersion: v1
kind: ConfigMap
metadata:
  name: graphql-async-request-publisher
  namespace: graphql
data:
  publisher.py: |
    #!/usr/bin/env python3
    import hashlib
    import json
    import os
    import signal
    import time
    import traceback
    import urllib.error
    import urllib.request
    import uuid
    from datetime import datetime, timedelta, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import psycopg

    KAFKA_REQUEST_TOPIC = os.environ.get("KAFKA_REQUEST_TOPIC", "graphql.async.requests.v1").strip()
    KAFKA_RESPONSE_TOPIC = os.environ.get("KAFKA_RESPONSE_TOPIC", "graphql.async.responses.v1").strip()
    DB_URL_PATH = os.environ.get("DB_URL_PATH", "/vault/secrets/db-url")

    DEFAULT_EXPIRES_IN_SECONDS = int(os.environ.get("DEFAULT_EXPIRES_IN_SECONDS", "86400"))
    MAX_EXPIRES_IN_SECONDS = int(os.environ.get("MAX_EXPIRES_IN_SECONDS", "1209600"))
    MAX_MESSAGE_BYTES = int(os.environ.get("MAX_MESSAGE_BYTES", "1048576"))
    MAX_OUTSTANDING_PER_CLIENT = int(os.environ.get("MAX_OUTSTANDING_PER_CLIENT", "100"))
    ASYNC_POLICY_URL = os.environ.get(
      "ASYNC_POLICY_URL",
      "http://graphql-gravitee-sync.graphql.svc.cluster.local:8080/async-policy/authorize",
    ).strip()
    ASYNC_POLICY_TIMEOUT_SECONDS = int(os.environ.get("ASYNC_POLICY_TIMEOUT_SECONDS", "5"))
    ASYNC_POLICY_ENFORCEMENT = os.environ.get("ASYNC_POLICY_ENFORCEMENT", "true").lower() in ("1", "true", "yes")
    ASYNC_POLICY_FAIL_OPEN = os.environ.get("ASYNC_POLICY_FAIL_OPEN", "false").lower() in ("1", "true", "yes")

    RUNNING = True

    INSERT_PENDING_SQL = """
    INSERT INTO graphql.client_async_messages (
      request_id,
      client_id,
      status,
      request_payload,
      kafka_topic,
      request_kafka_topic,
      metadata,
      expires_at,
      operation_type,
      operation_version,
      handler,
      operation,
      priority,
      not_before,
      max_attempts
    ) VALUES (
      %s,
      %s,
      'queued',
      %s::jsonb,
      %s,
      %s,
      %s::jsonb,
      %s::timestamptz,
      %s,
      %s,
      %s,
      %s,
      %s,
      %s::timestamptz,
      %s
    )
    ON CONFLICT (request_id) DO NOTHING
    RETURNING status, expires_at
    """

    INSERT_OUTBOX_SQL = """
    INSERT INTO graphql.async_operation_outbox (
      request_id,
      event_type,
      kafka_topic,
      message_key,
      payload,
      available_at
    ) VALUES (
      %s,
      'operation.requested',
      %s,
      %s,
      %s::jsonb,
      GREATEST(COALESCE(%s::timestamptz, NOW()), NOW())
    )
    """

    SELECT_EXISTING_SQL = """
    SELECT client_id, status, expires_at, metadata, created_at
    FROM graphql.client_async_messages
    WHERE request_id = %s
    """

    COUNT_OUTSTANDING_SQL = """
    SELECT COUNT(*)
    FROM graphql.client_async_messages
    WHERE client_id = %s
      AND status NOT IN ('succeeded', 'completed', 'failed', 'error', 'cancelled', 'expired', 'dead-lettered')
    """

    CANCEL_SQL = """
    UPDATE graphql.client_async_messages
    SET
      status = CASE
        WHEN status IN ('accepted', 'pending', 'queued', 'scheduled', 'retry-scheduled') THEN 'cancelled'
        ELSE 'cancel-requested'
      END,
      cancel_requested_at = NOW(),
      completed_at = CASE
        WHEN status IN ('accepted', 'pending', 'queued', 'scheduled', 'retry-scheduled') THEN NOW()
        ELSE completed_at
      END,
      metadata = COALESCE(metadata, '{}'::jsonb) || '{"cancel_requested":true}'::jsonb,
      updated_at = NOW()
    WHERE request_id = %s
      AND client_id = %s
      AND status NOT IN ('succeeded', 'completed', 'cancelled', 'expired', 'dead-lettered')
    RETURNING status
    """

    DELETE_UNPUBLISHED_OUTBOX_SQL = """
    DELETE FROM graphql.async_operation_outbox
    WHERE request_id = %s AND published_at IS NULL
    """

    RETRY_SELECT_SQL = """
    SELECT request_payload, request_kafka_topic, attempt_count, max_attempts, expires_at
    FROM graphql.client_async_messages
    WHERE request_id = %s AND client_id = %s
    FOR UPDATE
    """

    RETRY_UPDATE_SQL = """
    UPDATE graphql.client_async_messages
    SET
      status = 'retry-scheduled',
      attempt_count = attempt_count + 1,
      error_payload = NULL,
      response_payload = NULL,
      completed_at = NULL,
      cancel_requested_at = NULL,
      next_attempt_at = NOW(),
      metadata = COALESCE(metadata, '{}'::jsonb) || jsonb_build_object('retry_requested_at', NOW()),
      updated_at = NOW()
    WHERE request_id = %s
    RETURNING status, attempt_count
    """


    class RequestError(Exception):
      def __init__(self, status_code, message):
        super().__init__(message)
        self.status_code = int(status_code)
        self.message = str(message)


    def utc_now():
      return datetime.now(timezone.utc)


    def to_iso(value):
      if value is None:
        return None
      return value.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")


    def log(message):
      print(f"[{to_iso(utc_now())}] {message}", flush=True)


    def signal_handler(signum, _frame):
      global RUNNING
      RUNNING = False
      log(f"Received signal {signum}, shutting down")


    def wait_for_file(path):
      while RUNNING:
        if os.path.isfile(path) and os.path.getsize(path) > 0:
          return
        log(f"Waiting for secret file {path}")
        time.sleep(2)
      raise RuntimeError("Stopped while waiting for secret files")


    def read_secret(path, label):
      wait_for_file(path)
      with open(path, "r", encoding="utf-8") as handle:
        value = handle.read().strip()
      if not value:
        raise RuntimeError(f"{label} is empty at {path}")
      return value


    def parse_timestamp(value):
      if value is None:
        return None
      if isinstance(value, (int, float)):
        return datetime.fromtimestamp(float(value), tz=timezone.utc)
      if not isinstance(value, str):
        return None
      text = value.strip()
      if not text:
        return None
      if text.endswith("Z"):
        text = text[:-1] + "+00:00"
      try:
        parsed = datetime.fromisoformat(text)
      except ValueError:
        return None
      if parsed.tzinfo is None:
        parsed = parsed.replace(tzinfo=timezone.utc)
      return parsed.astimezone(timezone.utc)


    def normalize_dict_keys(data):
      normalized = {}
      if not isinstance(data, dict):
        return normalized
      for key, value in data.items():
        normalized[str(key).strip().lower()] = value
      return normalized


    def normalize_headers(raw_headers):
      if isinstance(raw_headers, dict):
        return normalize_dict_keys(raw_headers)
      if isinstance(raw_headers, list):
        headers = {}
        for item in raw_headers:
          if not isinstance(item, dict):
            continue
          name = item.get("name")
          value = item.get("value")
          if name and value is not None:
            headers[str(name).strip().lower()] = str(value)
        return headers
      return {}


    def parse_allowed_roles(value):
      if isinstance(value, list):
        return [str(item).strip().lower() for item in value if str(item).strip()]
      text = str(value or "").strip()
      if not text:
        return []
      if text.startswith("["):
        try:
          parsed = json.loads(text)
          if isinstance(parsed, list):
            return [str(item).strip().lower() for item in parsed if str(item).strip()]
        except Exception:
          pass
      return [item.strip().lower() for item in text.split(",") if item and item.strip()]


    def normalize_role_name(value):
      text = str(value or "").strip().lower()
      if text == "none":
        return ""
      return text


    def resolve_required_role(input_data, metadata):
      candidates = [
        input_data.get("required_role"),
        input_data.get("requiredRole"),
        input_data.get("required_role_for_access"),
        input_data.get("requiredRoleForAccess"),
        metadata.get("required_role"),
        metadata.get("requiredRole"),
        metadata.get("required_role_for_access"),
        metadata.get("requiredRoleForAccess"),
      ]
      for candidate in candidates:
        normalized = normalize_role_name(candidate)
        if normalized:
          return normalized
      return ""


    def ensure_required_role_granted(session_vars, required_role):
      normalized_required_role = normalize_role_name(required_role)
      if not normalized_required_role:
        return
      active_role = normalize_role_name(session_vars.get("x-hasura-role"))
      allowed_roles = parse_allowed_roles(session_vars.get("x-hasura-allowed-roles"))
      auth_roles = parse_allowed_roles(
        session_vars.get("x-hasura-auth-roles")
        or session_vars.get("x-hasura-user-roles")
        or session_vars.get("x-hasura-jwt-roles")
      )
      allowed_set = {
        normalize_role_name(item)
        for item in [*allowed_roles, *auth_roles]
        if normalize_role_name(item)
      }
      if active_role == normalized_required_role:
        return
      if normalized_required_role in allowed_set:
        return
      raise RequestError(403, f"missing required role: {normalized_required_role}")


    def extract_action_input(payload):
      input_data = payload.get("input") or {}
      if (
        isinstance(input_data, dict)
        and len(input_data) == 1
        and isinstance(input_data.get("input"), dict)
      ):
        input_data = input_data["input"]
      if not isinstance(input_data, dict):
        raise RequestError(400, "input must be an object")
      return input_data


    def resolve_client_id(session_vars, input_data):
      role = str(session_vars.get("x-hasura-role") or "").strip().lower()
      session_user_id = str(session_vars.get("x-hasura-user-id") or "").strip()
      input_client_id = input_data.get("client_id")
      if input_client_id is not None:
        input_client_id = str(input_client_id).strip() or None

      if role == "service":
        client_id = input_client_id or session_user_id
        if not client_id:
          raise RequestError(400, "client_id is required for service role")
        return client_id

      if not session_user_id:
        raise RequestError(403, "missing X-Hasura-User-Id session variable")
      if input_client_id and input_client_id != session_user_id:
        raise RequestError(403, "client_id must match X-Hasura-User-Id")
      return session_user_id


    def authorize_async_route(session_vars, handler_name, operation_name, required_role=""):
      if not ASYNC_POLICY_ENFORCEMENT:
        return
      role = str(session_vars.get("x-hasura-role") or "").strip().lower()
      if not role:
        raise RequestError(403, "missing X-Hasura-Role session variable")
      allowed_roles = parse_allowed_roles(session_vars.get("x-hasura-allowed-roles"))
      auth_roles = parse_allowed_roles(
        session_vars.get("x-hasura-auth-roles")
        or session_vars.get("x-hasura-user-roles")
        or session_vars.get("x-hasura-jwt-roles")
      )
      allowed_roles = sorted({*allowed_roles, *auth_roles})
      required_role = normalize_role_name(required_role)
      log(
        "Async policy request "
        + f"role={role} "
        + f"allowed_roles={json.dumps(allowed_roles)} "
        + f"required_role={required_role} "
        + f"handler={str(handler_name or '').strip().lower()} "
        + f"operation={str(operation_name or '').strip().lower()}"
      )
      payload = {
        "role": role,
        "handler": str(handler_name or "").strip().lower(),
        "operation": str(operation_name or "").strip().lower(),
        "allowed_roles": allowed_roles,
        "required_role": required_role,
      }
      req = urllib.request.Request(
        ASYNC_POLICY_URL,
        data=json.dumps(payload).encode("utf-8"),
        headers={"Content-Type": "application/json", "Accept": "application/json"},
        method="POST",
      )
      try:
        with urllib.request.urlopen(req, timeout=ASYNC_POLICY_TIMEOUT_SECONDS) as resp:
          raw = resp.read().decode("utf-8")
          response_payload = json.loads(raw or "{}")
          source = str(response_payload.get("source") or "")
          if bool(response_payload.get("allowed")):
            log(f"Async policy allowed source={source}")
            return
          log(f"Async policy denied source={source}")
          raise RequestError(403, "role not allowed for requested async route")
      except urllib.error.HTTPError as exc:
        if exc.code == 403:
          raise RequestError(403, "role not allowed for requested async route")
        if ASYNC_POLICY_FAIL_OPEN:
          log(f"Async policy call failed open (HTTP {exc.code})")
          return
        raise RequestError(503, "async route policy unavailable")
      except RequestError:
        raise
      except Exception as exc:
        if ASYNC_POLICY_FAIL_OPEN:
          log(f"Async policy call failed open: {exc}")
          return
        raise RequestError(503, "async route policy unavailable")


    def resolve_request_id(input_data, request_headers):
      candidate = input_data.get("request_id")
      if candidate is not None:
        request_id = str(candidate).strip()
        if request_id:
          return request_id
      header_id = request_headers.get("x-request-id") or request_headers.get("cf-ray")
      if header_id:
        return str(header_id).strip()
      return str(uuid.uuid4())


    def resolve_expiration(input_data, submitted_at):
      expires_at = parse_timestamp(input_data.get("expires_at"))
      if expires_at is not None:
        if expires_at <= submitted_at:
          raise RequestError(400, "expires_at must be in the future")
        return expires_at

      expires_in = input_data.get("expires_in_seconds")
      if expires_in is None:
        expires_in = DEFAULT_EXPIRES_IN_SECONDS
      try:
        expires_in = int(expires_in)
      except (TypeError, ValueError):
        raise RequestError(400, "expires_in_seconds must be an integer")
      if expires_in <= 0:
        raise RequestError(400, "expires_in_seconds must be greater than 0")
      if expires_in > MAX_EXPIRES_IN_SECONDS:
        expires_in = MAX_EXPIRES_IN_SECONDS
      return submitted_at + timedelta(seconds=expires_in)


    def parse_optional_object(value, field_name):
      if value is None:
        return {}
      if isinstance(value, dict):
        return value
      raise RequestError(400, f"{field_name} must be an object")


    def ensure_required_text(value, field_name):
      text = str(value or "").strip()
      if not text:
        raise RequestError(400, f"{field_name} is required")
      return text


    def parse_priority(input_data):
      priority = str(input_data.get("priority") or "normal").strip().lower()
      if priority not in ("urgent", "high", "normal", "low", "bulk"):
        raise RequestError(400, "priority must be urgent, high, normal, low, or bulk")
      return priority


    def build_message_spec(action_name, input_data, session_vars, request_headers):
      submitted_at = utc_now()
      client_id = resolve_client_id(session_vars, input_data)
      request_id = resolve_request_id(input_data, request_headers)
      expires_at = resolve_expiration(input_data, submitted_at)
      handler_name = ensure_required_text(input_data.get("handler"), "handler")
      operation_name = ensure_required_text(input_data.get("operation"), "operation")
      payload = input_data.get("payload")
      metadata = parse_optional_object(input_data.get("metadata"), "metadata")
      required_role = resolve_required_role(input_data, metadata)
      ensure_required_role_granted(session_vars, required_role)
      authorize_async_route(
        session_vars,
        handler_name,
        operation_name,
        required_role=required_role,
      )
      if required_role:
        metadata = dict(metadata)
        metadata.setdefault("required_role", required_role)
        metadata.setdefault("requiredRole", required_role)
      priority = parse_priority(input_data)
      not_before = parse_timestamp(input_data.get("not_before"))
      if input_data.get("not_before") is not None and not_before is None:
        raise RequestError(400, "not_before must be an ISO timestamp")
      if not_before is not None and not_before >= expires_at:
        raise RequestError(400, "not_before must be earlier than expires_at")
      max_attempts = metadata.get("max_attempts", input_data.get("max_attempts", 1))
      try:
        max_attempts = max(1, min(int(max_attempts), 100))
      except (TypeError, ValueError):
        raise RequestError(400, "max_attempts must be an integer")
      reply_topic = str(input_data.get("reply_topic") or KAFKA_RESPONSE_TOPIC).strip()
      if not reply_topic:
        reply_topic = KAFKA_RESPONSE_TOPIC
      if str(session_vars.get("x-hasura-role") or "").strip().lower() != "service" and reply_topic != KAFKA_RESPONSE_TOPIC:
        raise RequestError(403, "custom reply_topic is restricted to the service role")

      trace = {}
      traceparent = request_headers.get("traceparent")
      if traceparent:
        trace["traceparent"] = traceparent
      tracestate = request_headers.get("tracestate")
      if tracestate:
        trace["tracestate"] = tracestate
      if request_headers.get("x-request-id"):
        trace["request_id"] = str(request_headers["x-request-id"])

      message = {
        "spec_version": "async.request.v1",
        "request_id": request_id,
        "client_id": client_id,
        "route": {
          "handler": handler_name,
          "operation": operation_name,
        },
        "payload": payload,
        "options": {
          "priority": priority,
          "reply_topic": reply_topic,
          "expires_at": to_iso(expires_at),
          "not_before": to_iso(not_before),
          "max_attempts": max_attempts,
        },
        "metadata": metadata,
        "submitted_at": to_iso(submitted_at),
      }
      if trace:
        message["trace"] = trace
      if action_name:
        message["action"] = action_name
      return message, submitted_at, expires_at, not_before, max_attempts


    def get_db_url():
      return read_secret(DB_URL_PATH, "database URL")


    def request_fingerprint(message):
      metadata = message.get("metadata") if isinstance(message.get("metadata"), dict) else {}
      options = message.get("options") if isinstance(message.get("options"), dict) else {}
      identity = {
        "route": message.get("route"),
        "payload": message.get("payload"),
        "operation_type": metadata.get("operation_type"),
        "operation_version": metadata.get("operation_version"),
        "priority": options.get("priority"),
        "not_before": options.get("not_before"),
        "max_attempts": options.get("max_attempts"),
      }
      canonical = json.dumps(identity, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
      return hashlib.sha256(canonical.encode("utf-8")).hexdigest()


    def write_pending_record(db_url, request_id, client_id, message, expires_at, not_before, max_attempts):
      request_payload = json.dumps(message, separators=(",", ":"), ensure_ascii=False)
      route = message.get("route") if isinstance(message.get("route"), dict) else {}
      message_metadata = message.get("metadata") if isinstance(message.get("metadata"), dict) else {}
      metadata = json.dumps(
        {
          "request_topic": KAFKA_REQUEST_TOPIC,
          "request_publisher": "graphql-operation-ingress",
          "request_published": False,
          "operation_type": message_metadata.get("operation_type"),
          "operation_version": message_metadata.get("operation_version"),
          "priority": message.get("options", {}).get("priority", "normal"),
          "max_attempts": max_attempts,
          "request_fingerprint": request_fingerprint(message),
        },
        separators=(",", ":"),
        ensure_ascii=False,
      )
      with psycopg.connect(db_url, connect_timeout=10) as conn:
        conn.autocommit = False
        with conn.cursor() as cur:
          cur.execute("SELECT pg_advisory_xact_lock(hashtext(%s))", (client_id,))
          cur.execute(SELECT_EXISTING_SQL, (request_id,))
          existing_before_insert = cur.fetchone()
          if not existing_before_insert:
            cur.execute(COUNT_OUTSTANDING_SQL, (client_id,))
            outstanding = int(cur.fetchone()[0])
            if outstanding >= MAX_OUTSTANDING_PER_CLIENT:
              raise RequestError(429, f"outstanding operation limit reached ({MAX_OUTSTANDING_PER_CLIENT})")
          cur.execute(
            INSERT_PENDING_SQL,
            (
              request_id,
              client_id,
              request_payload,
              KAFKA_RESPONSE_TOPIC,
              KAFKA_REQUEST_TOPIC,
              metadata,
              expires_at,
              message_metadata.get("operation_type"),
              message_metadata.get("operation_version"),
              route.get("handler"),
              route.get("operation"),
              message.get("options", {}).get("priority", "normal"),
              not_before,
              max_attempts,
            ),
          )
          row = cur.fetchone()
          if row:
            cur.execute(
              INSERT_OUTBOX_SQL,
              (
                request_id,
                KAFKA_REQUEST_TOPIC,
                request_id,
                request_payload,
                not_before,
              ),
            )
            conn.commit()
            return {"inserted": True}

          cur.execute(SELECT_EXISTING_SQL, (request_id,))
          existing = cur.fetchone()
          conn.commit()
      if not existing:
        raise RuntimeError("request row lookup failed after conflict")
      existing_metadata = existing[3] if isinstance(existing[3], dict) else {}
      existing_fingerprint = str(existing_metadata.get("request_fingerprint") or "").strip()
      if existing_fingerprint and existing_fingerprint != request_fingerprint(message):
        raise RequestError(409, "request_id already exists with a different operation payload")
      return {
        "inserted": False,
        "client_id": str(existing[0]),
        "status": str(existing[1]),
        "expires_at": existing[2],
        "submitted_at": existing[4],
      }


    def message_size_bytes(message):
      return len(json.dumps(message, separators=(",", ":"), ensure_ascii=False).encode("utf-8"))


    def resolve_operation_id(input_data):
      operation_id = str(input_data.get("operation_id") or input_data.get("request_id") or "").strip()
      if not operation_id:
        raise RequestError(400, "operation_id is required")
      return operation_id


    def cancel_operation(db_url, operation_id, client_id):
      with psycopg.connect(db_url, connect_timeout=10) as conn:
        with conn.cursor() as cur:
          cur.execute(CANCEL_SQL, (operation_id, client_id))
          row = cur.fetchone()
          if not row:
            raise RequestError(404, "operation was not found or is already terminal")
          if str(row[0]) == "cancelled":
            cur.execute(DELETE_UNPUBLISHED_OUTBOX_SQL, (operation_id,))
        conn.commit()
      return {"operation_id": operation_id, "status": str(row[0])}


    def retry_operation(db_url, operation_id, client_id):
      with psycopg.connect(db_url, connect_timeout=10) as conn:
        with conn.cursor() as cur:
          cur.execute(RETRY_SELECT_SQL, (operation_id, client_id))
          row = cur.fetchone()
          if not row:
            raise RequestError(404, "operation was not found")
          request_payload, request_kafka_topic, attempt_count, max_attempts, expires_at = row
          if int(attempt_count or 0) + 1 >= int(max_attempts or 1):
            raise RequestError(409, "operation retry limit has been reached")
          if expires_at is not None and expires_at <= utc_now():
            raise RequestError(409, "expired operations cannot be retried")
          current_status = None
          cur.execute("SELECT status FROM graphql.client_async_messages WHERE request_id = %s", (operation_id,))
          status_row = cur.fetchone()
          current_status = str(status_row[0]) if status_row else ""
          if current_status not in ("failed", "error", "dead-lettered", "cancelled"):
            raise RequestError(409, "only terminal unsuccessful operations can be retried")
          cur.execute(RETRY_UPDATE_SQL, (operation_id,))
          updated = cur.fetchone()
          cur.execute(
            INSERT_OUTBOX_SQL,
            (
              operation_id,
              str(request_kafka_topic or KAFKA_REQUEST_TOPIC),
              operation_id,
              json.dumps(request_payload, separators=(",", ":"), ensure_ascii=False),
              None,
            ),
          )
        conn.commit()
      return {"operation_id": operation_id, "status": str(updated[0]), "attempt_count": int(updated[1])}


    class Handler(BaseHTTPRequestHandler):
      def log_message(self, _format, *_args):
        return

      def send_json(self, status_code, payload):
        body = json.dumps(payload, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
        self.send_response(status_code)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

      def do_GET(self):
        if self.path == "/healthz":
          self.send_json(200, {"ok": True})
          return
        self.send_json(404, {"error": "not_found"})

      def do_POST(self):
        action_path = self.path.split("?", 1)[0].rstrip("/")
        if action_path not in (
          "/action/publish_async_request",
          "/action/cancel_async_operation",
          "/action/retry_async_operation",
        ):
          self.send_json(404, {"error": "not_found"})
          return

        content_length = int(self.headers.get("Content-Length", "0"))
        raw_body = self.rfile.read(content_length) if content_length else b""
        request_id = None
        try:
          payload = json.loads(raw_body.decode("utf-8") or "{}")
          if not isinstance(payload, dict):
            raise RequestError(400, "payload must be a JSON object")

          input_data = extract_action_input(payload)
          session_vars = normalize_dict_keys(payload.get("session_variables") or {})
          request_headers = normalize_headers(payload.get("request_headers"))
          if isinstance(payload.get("request"), dict):
            request_headers.update(normalize_headers(payload.get("request", {}).get("headers")))
          if not request_headers:
            request_headers = normalize_headers(payload.get("headers"))
          if not request_headers:
            request_headers = normalize_headers(dict(self.headers))
          action_name = ""
          if isinstance(payload.get("action"), dict):
            action_name = str(payload.get("action", {}).get("name") or "").strip()

          if action_path in ("/action/cancel_async_operation", "/action/retry_async_operation"):
            client_id = resolve_client_id(session_vars, input_data)
            operation_id = resolve_operation_id(input_data)
            db_url = get_db_url()
            result = cancel_operation(db_url, operation_id, client_id) if action_path.endswith("cancel_async_operation") else retry_operation(db_url, operation_id, client_id)
            self.send_json(200, result)
            return

          message, submitted_at, expires_at, not_before, max_attempts = build_message_spec(
            action_name=action_name,
            input_data=input_data,
            session_vars=session_vars,
            request_headers=request_headers,
          )
          request_id = str(message["request_id"])
          if message_size_bytes(message) > MAX_MESSAGE_BYTES:
            raise RequestError(400, f"message exceeds MAX_MESSAGE_BYTES={MAX_MESSAGE_BYTES}")
          db_url = get_db_url()

          upsert_result = write_pending_record(
            db_url=db_url,
            request_id=request_id,
            client_id=str(message["client_id"]),
            message=message,
            expires_at=expires_at,
            not_before=not_before,
            max_attempts=max_attempts,
          )
          if not upsert_result["inserted"]:
            if upsert_result["client_id"] != str(message["client_id"]):
              raise RequestError(409, "request_id already exists for a different client_id")
            self.send_json(
              200,
              {
                "request_id": request_id,
                "status": "duplicate",
                "kafka_topic": KAFKA_REQUEST_TOPIC,
                "client_id": str(message["client_id"]),
                "submitted_at": to_iso(upsert_result.get("submitted_at") or submitted_at),
                "expires_at": to_iso(upsert_result.get("expires_at")),
              },
            )
            return

          self.send_json(
            200,
            {
              "request_id": request_id,
              "status": "accepted",
              "kafka_topic": KAFKA_REQUEST_TOPIC,
              "delivery": "transactional-outbox",
              "client_id": str(message["client_id"]),
              "submitted_at": to_iso(submitted_at),
              "expires_at": to_iso(expires_at),
            },
          )
        except RequestError as exc:
          self.send_json(exc.status_code, {"message": exc.message, "request_id": request_id})
        except Exception as exc:
          log(f"Operation action failed path={action_path}: {exc}")
          traceback.print_exc()
          self.send_json(500, {"message": "internal error", "request_id": request_id})


    def main():
      signal.signal(signal.SIGTERM, signal_handler)
      signal.signal(signal.SIGINT, signal_handler)
      wait_for_file(DB_URL_PATH)
      log(
        "Generic operation ingress started "
        f"request_topic={KAFKA_REQUEST_TOPIC}"
      )
      server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
      server.serve_forever()


    if __name__ == "__main__":
      main()
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-async-request-publisher
  namespace: graphql
spec:
  selector:
    app: graphql-async-request-publisher
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-async-request-publisher
  namespace: graphql
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graphql-async-request-publisher
  template:
    metadata:
      labels:
        app: graphql-async-request-publisher
      annotations:
        linkerd.io/inject: "disabled"
        reloader.stakater.com/auto: "true"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "graphql-async-response-writer"
        vault.hashicorp.com/agent-inject-secret-db-url: "yugabyte-db/static-creds/graphql-yb-admin"
        vault.hashicorp.com/agent-inject-template-db-url: |
          {{- with secret "yugabyte-db/static-creds/graphql-yb-admin" -}}
          postgresql://{{ .Data.username }}:{{ .Data.password }}@yb-tserver-service.yugabyte.svc.cluster.local:5433/hasura?sslmode=disable
          {{- end }}
    spec:
      serviceAccountName: graphql-async-response-writer
      containers:
        - name: request-publisher
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: KAFKA_REQUEST_TOPIC
              value: "graphql.async.requests.v1"
            - name: KAFKA_RESPONSE_TOPIC
              value: "graphql.async.responses.v1"
            - name: DB_URL_PATH
              value: "/vault/secrets/db-url"
            - name: DEFAULT_EXPIRES_IN_SECONDS
              value: "86400"
            - name: MAX_EXPIRES_IN_SECONDS
              value: "1209600"
            - name: MAX_MESSAGE_BYTES
              value: "1048576"
            - name: MAX_OUTSTANDING_PER_CLIENT
              value: "100"
            - name: ASYNC_POLICY_URL
              value: "http://graphql-gravitee-sync.graphql.svc.cluster.local:8080/async-policy/authorize"
            - name: ASYNC_POLICY_TIMEOUT_SECONDS
              value: "5"
            - name: ASYNC_POLICY_ENFORCEMENT
              value: "true"
            - name: ASYNC_POLICY_FAIL_OPEN
              value: "false"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir --disable-pip-version-check \
                "psycopg[binary]>=3.1.0,<4.0.0"
              exec python /opt/config/publisher.py
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: publisher-config
              mountPath: /opt/config
              readOnly: true
      volumes:
        - name: publisher-config
          configMap:
            name: graphql-async-request-publisher
            defaultMode: 0555
