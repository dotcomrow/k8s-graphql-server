apiVersion: v1
kind: ServiceAccount
metadata:
  name: graphql-gravitee-sync
  namespace: graphql
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: graphql-gravitee-sync
  namespace: graphql
data:
  sync.py: |
    #!/usr/bin/env python3
    import base64
    import json
    import os
    import re
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    import ssl
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    import jwt
    from jwt import PyJWKClient, decode as jwt_decode

    MANAGED_COMMENT = "managed-by=gravitee-hasura-sync"
    DEFAULT_OPT_IN_TAGS = "hasura"
    DEFAULT_ENDPOINT_LABEL = "hasura.endpoint"

    HASURA_URL = os.environ.get("HASURA_URL", "http://hasura.graphql.svc.cluster.local:8080").rstrip("/")
    HASURA_ADMIN_SECRET_PATH = os.environ.get("HASURA_ADMIN_SECRET_PATH", "/vault/secrets/hasura-admin")

    GRAVITEE_MANAGEMENT_API = os.environ.get(
        "GRAVITEE_MANAGEMENT_API",
        "http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083/management",
    ).rstrip("/")
    GRAVITEE_ORG = os.environ.get("GRAVITEE_ORG", "DEFAULT")
    GRAVITEE_ENV = os.environ.get("GRAVITEE_ENV", "DEFAULT")
    GRAVITEE_GATEWAY_URL = os.environ.get(
        "GRAVITEE_GATEWAY_URL",
        "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082",
    ).rstrip("/")
    GRAVITEE_ADMIN_USERNAME_PATH = os.environ.get("GRAVITEE_ADMIN_USERNAME_PATH", "/vault/secrets/gravitee-admin-username")
    GRAVITEE_ADMIN_PASSWORD_PATH = os.environ.get("GRAVITEE_ADMIN_PASSWORD_PATH", "/vault/secrets/gravitee-admin-password")

    WEBHOOK_SECRET_PATH = os.environ.get("WEBHOOK_SECRET_PATH", "/vault/secrets/gravitee-webhook-secret")
    OPT_IN_TAGS = os.environ.get("HASURA_OPT_IN_TAGS", DEFAULT_OPT_IN_TAGS)
    OPT_IN_LABEL = os.environ.get("HASURA_OPT_IN_LABEL", "")
    ENDPOINT_LABEL_KEY = os.environ.get("HASURA_ENDPOINT_LABEL", DEFAULT_ENDPOINT_LABEL)
    MODE_LABEL_KEY = os.environ.get("HASURA_MODE_LABEL", "hasura.mode")

    ACTION_HANDLER_URL = os.environ.get(
        "ACTION_HANDLER_URL",
        "http://graphql-gravitee-sync.graphql.svc.cluster.local:8080/action",
    )
    SYNC_INTERVAL = int(os.environ.get("SYNC_INTERVAL", "300"))
    JWT_CLOCK_SKEW_SECONDS = int(os.environ.get("JWT_CLOCK_SKEW_SECONDS", "60"))
    ACTION_TIMEOUT_SECONDS = int(os.environ.get("ACTION_TIMEOUT_SECONDS", "30"))
    REMOTE_SCHEMA_TIMEOUT_SECONDS = int(os.environ.get("REMOTE_SCHEMA_TIMEOUT_SECONDS", "60"))
    INSECURE_SKIP_VERIFY = os.environ.get("INSECURE_SKIP_VERIFY", "false").lower() in ("1", "true", "yes")

    INTERNAL_JWK_URL = os.environ.get(
        "INTERNAL_JWK_URL",
        "https://auth.suncoast.systems/realms/internal/protocol/openid-connect/certs",
    )
    INTERNAL_ISSUER = os.environ.get("INTERNAL_ISSUER", "https://auth.suncoast.systems/realms/internal")
    INTERNAL_AUDIENCE = os.environ.get("INTERNAL_AUDIENCE", "hasura-console-proxy")
    EXTERNAL_JWK_URL = os.environ.get(
        "EXTERNAL_JWK_URL",
        "https://auth.suncoast.systems/realms/external/protocol/openid-connect/certs",
    )
    EXTERNAL_ISSUER = os.environ.get("EXTERNAL_ISSUER", "https://auth.suncoast.systems/realms/external")
    EXTERNAL_AUDIENCE_PATH = os.environ.get("EXTERNAL_AUDIENCE_PATH", "/vault/secrets/graphql-api-client-id")
    CLAIMS_NAMESPACE = "https://hasura.io/jwt/claims"
    CLAIMS_PARENT = "https://hasura"
    CLAIMS_CHILD = "io/jwt/claims"

    _jwks_clients = {}
    _aud_cache = {"value": None, "loaded_at": 0.0}

    OPENAPI_PAGE_TYPES = {"SWAGGER", "OPENAPI"}
    ACTION_MAP = {}
    ASYNC_POLICY_MAP = {}
    API_DETAIL_CACHE = {}
    ACTION_LOCK = threading.Lock()
    SYNC_LOCK = threading.Lock()

    def log(message):
        print(message, flush=True)

    def read_file(path):
        try:
            with open(path, "r", encoding="utf-8") as handle:
                return handle.read().strip()
        except FileNotFoundError:
            return ""

    def urlopen(req, timeout=30):
        if INSECURE_SKIP_VERIFY and req.full_url.startswith("https://"):
            ctx = ssl._create_unverified_context()
            return urllib.request.urlopen(req, timeout=timeout, context=ctx)
        return urllib.request.urlopen(req, timeout=timeout)

    def gravitee_auth_header():
        username = read_file(GRAVITEE_ADMIN_USERNAME_PATH)
        password = read_file(GRAVITEE_ADMIN_PASSWORD_PATH)
        if not username or not password:
            raise RuntimeError("Gravitee admin credentials not available")
        token = base64.b64encode(f"{username}:{password}".encode("utf-8")).decode("utf-8")
        return f"Basic {token}"

    def gravitee_request(method, path, payload=None, accept="application/json"):
        headers = {"Authorization": gravitee_auth_header(), "Accept": accept}
        data = None
        if payload is not None:
            headers["Content-Type"] = "application/json"
            data = json.dumps(payload).encode("utf-8")
        req = urllib.request.Request(GRAVITEE_MANAGEMENT_API + path, data=data, headers=headers, method=method)
        with urlopen(req, timeout=30) as resp:
            return resp.read()

    def api_id_of(api):
        return api.get("id") or api.get("_id") or ""

    def get_api_detail(api_id):
        if api_id in API_DETAIL_CACHE:
            return API_DETAIL_CACHE[api_id]
        paths = [
            f"/v2/organizations/{GRAVITEE_ORG}/environments/{GRAVITEE_ENV}/apis/{api_id}",
            f"/organizations/{GRAVITEE_ORG}/environments/{GRAVITEE_ENV}/apis/{api_id}",
        ]
        for path in paths:
            try:
                body = gravitee_request("GET", path)
                data = json.loads(body.decode("utf-8") or "{}")
                if data:
                    API_DETAIL_CACHE[api_id] = data
                    return data
            except urllib.error.HTTPError as exc:
                if exc.code in (404, 405):
                    continue
                raise
        return {}

    def hasura_request(payload):
        admin_secret = read_file(HASURA_ADMIN_SECRET_PATH)
        if not admin_secret:
            raise RuntimeError("Hasura admin secret not available")
        body = json.dumps(payload).encode("utf-8")
        headers = {
            "Content-Type": "application/json",
            "X-Hasura-Admin-Secret": admin_secret,
        }
        req = urllib.request.Request(f"{HASURA_URL}/v1/metadata", data=body, headers=headers, method="POST")
        with urlopen(req, timeout=30) as resp:
            raw = resp.read().decode("utf-8")
        return json.loads(raw) if raw else {}

    def parse_label_map(api):
        labels = api.get("labels") or []
        label_map = {}
        for label in labels:
            label = str(label).strip()
            if not label:
                continue
            if "=" in label:
                key, value = label.split("=", 1)
                label_map[key.strip()] = value.strip()
            else:
                label_map[label] = "true"
        return label_map

    def parse_csv(value):
        if not value:
            return []
        return [item.strip() for item in value.split(",") if item.strip()]

    def parse_multi_delimited(value):
        if not value:
            return []
        if isinstance(value, list):
            values = []
            for item in value:
                values.extend(parse_multi_delimited(item))
            return values
        text = str(value)
        parts = re.split(r"[,\|;]", text)
        return [item.strip() for item in parts if item and item.strip()]

    ACTION_ALLOWED_ROLES = parse_csv(os.environ.get("HASURA_ACTION_ROLES", "user"))
    ACTION_ROLES_LABEL_KEY = os.environ.get("HASURA_ACTION_ROLES_LABEL", "hasura.action.roles")
    ASYNC_POLICY_DEFAULT_ALLOW = os.environ.get("ASYNC_POLICY_DEFAULT_ALLOW", "true").lower() in ("1", "true", "yes")
    ASYNC_HANDLER_LABEL_KEY = os.environ.get("ASYNC_HANDLER_LABEL", "hasura.async.handler")
    ASYNC_HANDLERS_LABEL_KEY = os.environ.get("ASYNC_HANDLERS_LABEL", "hasura.async.handlers")
    ASYNC_OPERATION_ROLES_LABEL_PREFIX = os.environ.get(
        "ASYNC_OPERATION_ROLES_LABEL_PREFIX",
        "hasura.async.operation.roles.",
    )
    USER_ID_CLAIM = os.environ.get("USER_ID_CLAIM", "sub")
    USER_EMAIL_CLAIM = os.environ.get("USER_EMAIL_CLAIM", "email")
    USER_USERNAME_CLAIM = os.environ.get("USER_USERNAME_CLAIM", "preferred_username")

    def label_opt_in(labels):
        if OPT_IN_LABEL:
            if "=" in OPT_IN_LABEL:
                key, value = OPT_IN_LABEL.split("=", 1)
                key = key.strip()
                value = value.strip()
                return bool(key) and labels.get(key) == value
            key = OPT_IN_LABEL.strip()
            return bool(key) and key in labels
        want = set(parse_csv(OPT_IN_TAGS))
        if not want:
            return False
        for key in labels:
            if str(key).strip() in want:
                return True
        return False

    def tag_opt_in(tags):
        want = set(parse_csv(OPT_IN_TAGS))
        if not want:
            return False
        for tag in tags or []:
            if str(tag).strip() in want:
                return True
        return False

    def slugify(value):
        text = str(value or "").strip()
        text = re.sub(r"[^A-Za-z0-9_]+", "_", text)
        text = text.strip("_").lower()
        if not text or text[0].isdigit():
            text = f"api_{text}"
        return text

    def unique_name(base, existing):
        name = base
        index = 1
        while name in existing:
            index += 1
            name = f"{base}_{index}"
        existing.add(name)
        return name

    def extract_bearer_token(auth_header):
        if not auth_header:
            return ""
        token = auth_header.strip()
        if token.lower().startswith("bearer "):
            token = token[7:].strip()
        return token

    def decode_jwt_payload(token):
        parts = token.split(".")
        if len(parts) < 2:
            return {}
        payload = parts[1]
        payload += "=" * (-len(payload) % 4)
        try:
            decoded = base64.urlsafe_b64decode(payload.encode("utf-8"))
            return json.loads(decoded.decode("utf-8") or "{}")
        except Exception:
            return {}

    def extract_user_claims(auth_header):
        token = extract_bearer_token(auth_header)
        if not token:
            return {}
        claims = decode_jwt_payload(token)
        if not isinstance(claims, dict):
            return {}
        return {
            "user_id": claims.get(USER_ID_CLAIM) or claims.get("sub"),
            "user_email": claims.get(USER_EMAIL_CLAIM) or claims.get("email"),
            "user_username": claims.get(USER_USERNAME_CLAIM) or claims.get("preferred_username"),
            "user_issuer": claims.get("iss"),
        }

    def list_apis():
        paths = [
            f"/v2/organizations/{GRAVITEE_ORG}/environments/{GRAVITEE_ENV}/apis?size=1000",
            f"/organizations/{GRAVITEE_ORG}/environments/{GRAVITEE_ENV}/apis?size=1000",
        ]
        for path in paths:
            try:
                body = gravitee_request("GET", path)
                data = json.loads(body.decode("utf-8") or "[]")
                if isinstance(data, dict) and "data" in data:
                    return data.get("data") or []
                if isinstance(data, dict) and "items" in data:
                    return data.get("items") or []
                if isinstance(data, list):
                    return data
            except urllib.error.HTTPError as exc:
                if exc.code in (404, 405):
                    continue
                raise
        return []

    def list_pages(api_id):
        paths = [
            f"/v2/organizations/{GRAVITEE_ORG}/environments/{GRAVITEE_ENV}/apis/{api_id}/pages?size=200",
            f"/organizations/{GRAVITEE_ORG}/environments/{GRAVITEE_ENV}/apis/{api_id}/pages",
        ]
        for path in paths:
            try:
                body = gravitee_request("GET", path)
                data = json.loads(body.decode("utf-8") or "[]")
                if isinstance(data, dict) and "data" in data:
                    return data.get("data") or []
                if isinstance(data, dict) and "items" in data:
                    return data.get("items") or []
                if isinstance(data, list):
                    return data
            except urllib.error.HTTPError as exc:
                if exc.code in (404, 405):
                    continue
                raise
        return []

    def extract_context_path(api):
        for key in ("contextPath", "context_path"):
            value = api.get(key)
            if value:
                return str(value)
        listeners = api.get("listeners") or []
        for listener in listeners:
            for path in listener.get("paths") or []:
                path_value = path.get("path")
                if path_value:
                    return str(path_value)
        return ""

    def build_endpoint_from_context(api, api_id):
        context_path = extract_context_path(api)
        if not context_path and api_id:
            detail = get_api_detail(api_id)
            context_path = extract_context_path(detail)
        if not context_path:
            return ""
        if not context_path.startswith("/"):
            context_path = f"/{context_path}"
        return f"{GRAVITEE_GATEWAY_URL}{context_path}"

    def fetch_url(url):
        headers = {"Accept": "application/json, */*"}
        req = urllib.request.Request(url, headers=headers, method="GET")
        with urlopen(req, timeout=30) as resp:
            return resp.read().decode("utf-8")

    def fetch_page_content(api_id, page):
        content = page.get("content")
        if content:
            return content
        source = page.get("source") or {}
        config = source.get("configuration") or {}
        url = config.get("url")
        if url:
            return fetch_url(url)
        page_id = page.get("id")
        if not page_id:
            return ""
        detail_paths = [
            f"/v2/organizations/{GRAVITEE_ORG}/environments/{GRAVITEE_ENV}/apis/{api_id}/pages/{page_id}",
            f"/organizations/{GRAVITEE_ORG}/environments/{GRAVITEE_ENV}/apis/{api_id}/pages/{page_id}",
        ]
        for path in detail_paths:
            try:
                body = gravitee_request("GET", path)
                data = json.loads(body.decode("utf-8") or "{}")
                content = data.get("content")
                if content:
                    return content
                source = data.get("source") or {}
                config = source.get("configuration") or {}
                url = config.get("url")
                if url:
                    return fetch_url(url)
            except urllib.error.HTTPError as exc:
                if exc.code in (404, 405):
                    continue
                raise
        content_paths = [
            f"/v2/organizations/{GRAVITEE_ORG}/environments/{GRAVITEE_ENV}/apis/{api_id}/pages/{page_id}/content",
            f"/organizations/{GRAVITEE_ORG}/environments/{GRAVITEE_ENV}/apis/{api_id}/pages/{page_id}/content",
        ]
        for path in content_paths:
            try:
                body = gravitee_request("GET", path, accept="*/*")
                text = body.decode("utf-8").strip()
                if text:
                    return text
            except urllib.error.HTTPError as exc:
                if exc.code in (404, 405):
                    continue
                raise
        return ""

    def parse_openapi(text):
        if not text:
            return None
        try:
            return json.loads(text)
        except json.JSONDecodeError:
            try:
                import yaml  # type: ignore
            except Exception:
                log("OpenAPI payload is not JSON and PyYAML is unavailable")
                return None
            try:
                return yaml.safe_load(text)
            except Exception as exc:
                log(f"Failed to parse OpenAPI payload: {exc}")
                return None

    def find_openapi_spec(api_id):
        pages = list_pages(api_id)
        for page in pages:
            page_type = str(page.get("type", "")).upper()
            if page_type not in OPENAPI_PAGE_TYPES:
                continue
            content = fetch_page_content(api_id, page)
            spec = parse_openapi(content)
            if spec:
                return spec
        return None

    def build_actions(api, endpoint, spec, existing_names, action_roles):
        actions = []
        mapping = {}
        paths = spec.get("paths") or {}
        api_name = api.get("name") or api.get("id") or "api"
        api_slug = slugify(api_name)
        api_id = api.get("id") or api.get("_id") or api_name
        for path, methods in paths.items():
            if not isinstance(methods, dict):
                continue
            for method, details in methods.items():
                method_lower = str(method).lower()
                if method_lower not in ("get", "post", "put", "patch", "delete", "head", "options"):
                    continue
                op_id = ""
                if isinstance(details, dict):
                    op_id = details.get("operationId") or ""
                if not op_id:
                    op_id = f"{method_lower}_{path}"
                action_base = slugify(op_id)
                action_name = unique_name(f"gravitee_{api_slug}_{action_base}", existing_names)
                actions.append({
                    "name": action_name,
                    "definition": {
                        "kind": "synchronous",
                        "type": "mutation",
                        "handler": ACTION_HANDLER_URL,
                        "forward_client_headers": True,
                        "arguments": [{"name": "input", "type": "json"}],
                        "output_type": "json",
                    },
                    "permissions": [{"role": role} for role in action_roles],
                    "comment": f"{MANAGED_COMMENT} api={api_id} method={method_lower} path={path}",
                })
                mapping[action_name] = {
                    "method": method_lower.upper(),
                    "path": path,
                    "base_url": endpoint.rstrip("/"),
                }
        return actions, mapping

    def build_remote_schema(api, endpoint, existing_names):
        api_name = api.get("name") or api.get("id") or "api"
        api_slug = slugify(api_name)
        api_id = api.get("id") or api.get("_id") or api_name
        name = unique_name(f"gravitee_{api_slug}", existing_names)
        schema = {
            "name": name,
            "definition": {
                "url": endpoint,
                "timeout_seconds": REMOTE_SCHEMA_TIMEOUT_SECONDS,
                "forward_client_headers": True,
            },
            "comment": f"{MANAGED_COMMENT} api={api_id}",
        }
        return schema

    def merge_async_policy(async_policy_map, api, labels):
        handlers = []
        primary_handler = str(labels.get(ASYNC_HANDLER_LABEL_KEY) or "").strip()
        if primary_handler:
            handlers.append(primary_handler)
        handlers.extend(parse_multi_delimited(labels.get(ASYNC_HANDLERS_LABEL_KEY, "")))
        handlers = sorted({item.strip().lower() for item in handlers if str(item).strip()})
        if not handlers:
            return

        default_roles = sorted(
            {
                role.strip().lower()
                for role in parse_multi_delimited(labels.get(ACTION_ROLES_LABEL_KEY, ""))
                if role and role.strip()
            }
        )

        operation_roles = {}
        for key, value in labels.items():
            key_text = str(key)
            if not key_text.startswith(ASYNC_OPERATION_ROLES_LABEL_PREFIX):
                continue
            operation = key_text[len(ASYNC_OPERATION_ROLES_LABEL_PREFIX):].strip().lower()
            if not operation:
                continue
            roles = sorted(
                {
                    role.strip().lower()
                    for role in parse_multi_delimited(value)
                    if role and role.strip()
                }
            )
            if roles:
                operation_roles[operation] = roles

        api_ref = api_id_of(api) or str(api.get("name") or "api")
        for handler in handlers:
            entry = async_policy_map.setdefault(
                handler,
                {"roles": set(), "operations": {}, "apis": set()},
            )
            entry["apis"].add(api_ref)
            for role in default_roles:
                entry["roles"].add(role)
            for operation, roles in operation_roles.items():
                op_entry = entry["operations"].setdefault(operation, set())
                for role in roles:
                    op_entry.add(role)

    def finalize_async_policy_map(async_policy_map):
        finalized = {}
        for handler, entry in (async_policy_map or {}).items():
            roles = sorted(set(entry.get("roles", set())))
            operations = {}
            for operation, op_roles in (entry.get("operations") or {}).items():
                op_set = sorted(set(op_roles or []))
                if op_set:
                    operations[str(operation)] = op_set
            finalized[str(handler)] = {
                "roles": roles,
                "operations": operations,
                "apis": sorted(set(entry.get("apis", set()))),
            }
        return finalized

    def normalize_role_name(value):
        text = str(value or "").strip().lower()
        if text == "none":
            return ""
        return text

    def authorize_async_route(role, handler, operation, allowed_roles=None, required_role=None):
        role = str(role or "").strip().lower()
        handler = str(handler or "").strip().lower()
        operation = str(operation or "").strip().lower()
        required_role = normalize_role_name(required_role)
        allowed = {
            normalize_role_name(item)
            for item in (allowed_roles or [])
            if normalize_role_name(item)
        }
        if not role:
            return False, "missing_role"
        if not handler:
            return False, "missing_handler"
        required_role_granted = bool(
            required_role and (required_role == role or required_role in allowed)
        )
        if required_role and not required_role_granted:
            return False, "required_role_not_granted"
        # When a required role is supplied by module configuration (Directus),
        # enforce that role end-to-end regardless of static handler annotations.
        if required_role_granted:
            return True, "required_role_granted"
        with ACTION_LOCK:
            entry = ASYNC_POLICY_MAP.get(handler)
        if not entry:
            return ASYNC_POLICY_DEFAULT_ALLOW, "default_allow_no_handler_policy"
        operations = entry.get("operations") or {}
        if operation and operation in operations:
            allowed_roles = operations.get(operation) or []
            if not allowed_roles:
                return False, "operation_policy_empty"
            allowed_set = {
                normalize_role_name(item)
                for item in allowed_roles
                if normalize_role_name(item)
            }
            if role in allowed_set:
                return True, "operation_policy_active_role"
            if allowed.intersection(allowed_set):
                return True, "operation_policy_allowed_roles"
            return False, "operation_policy"
        allowed_roles = entry.get("roles") or []
        if not allowed_roles:
            return ASYNC_POLICY_DEFAULT_ALLOW, "default_allow_empty_handler_policy"
        allowed_set = {
            normalize_role_name(item)
            for item in allowed_roles
            if normalize_role_name(item)
        }
        if role in allowed_set:
            return True, "handler_policy_active_role"
        if allowed.intersection(allowed_set):
            return True, "handler_policy_allowed_roles"
        return False, "handler_policy"

    def merge_metadata(metadata, actions, remote_schemas):
        metadata = dict(metadata or {})
        actions = sorted(actions, key=lambda item: str(item.get("name", "")))
        remote_schemas = sorted(remote_schemas, key=lambda item: str(item.get("name", "")))
        existing_actions = metadata.get("actions") or []
        kept_actions = [action for action in existing_actions if MANAGED_COMMENT not in str(action.get("comment", ""))]
        merged_actions = sorted(
            kept_actions + actions,
            key=lambda item: str(item.get("name", "")),
        )
        if merged_actions:
            metadata["actions"] = merged_actions
        else:
            metadata.pop("actions", None)

        existing_remotes = metadata.get("remote_schemas") or []
        kept_remotes = [remote for remote in existing_remotes if MANAGED_COMMENT not in str(remote.get("comment", ""))]
        merged_remotes = sorted(
            kept_remotes + remote_schemas,
            key=lambda item: str(item.get("name", "")),
        )
        if merged_remotes:
            metadata["remote_schemas"] = merged_remotes
        else:
            metadata.pop("remote_schemas", None)

        custom_types = metadata.get("custom_types") or {}
        scalars = custom_types.get("scalars") or []
        if not any(item.get("name") == "json" for item in scalars if isinstance(item, dict)):
            scalars.append({"name": "json"})
        custom_types["scalars"] = scalars
        metadata["custom_types"] = custom_types
        return metadata

    def canonical_json(value):
        return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False)

    def sync_once():
        if not SYNC_LOCK.acquire(blocking=False):
            return
        try:
            apis = list_apis()
            actions = []
            remotes = []
            action_mapping = {}
            async_policy_map = {}
            existing_names = set()
            for api in apis:
                labels = parse_label_map(api)
                tags = api.get("tags") or []
                if not (tag_opt_in(tags) or label_opt_in(labels)):
                    continue
                merge_async_policy(async_policy_map, api, labels)
                api_id = api_id_of(api)
                endpoint = labels.get(ENDPOINT_LABEL_KEY) or build_endpoint_from_context(api, api_id)
                if not endpoint:
                    api_name = api.get("name") or api.get("id") or "api"
                    log(f"Skipping {api_name}: missing {ENDPOINT_LABEL_KEY} label or context path")
                    continue
                mode = labels.get(MODE_LABEL_KEY, "").lower()
                if mode == "graphql":
                    remotes.append(build_remote_schema(api, endpoint, existing_names))
                    continue
                spec = find_openapi_spec(api_id)
                if spec:
                    action_roles = parse_multi_delimited(labels.get(ACTION_ROLES_LABEL_KEY, ""))
                    if not action_roles:
                        action_roles = ACTION_ALLOWED_ROLES
                    new_actions, mapping = build_actions(api, endpoint, spec, existing_names, action_roles)
                    actions.extend(new_actions)
                    action_mapping.update(mapping)
                    continue
                if mode == "openapi":
                    api_name = api.get("name") or api.get("id") or "api"
                    log(f"Skipping {api_name}: hasura.mode=openapi but no OpenAPI spec found")
                    continue
                remotes.append(build_remote_schema(api, endpoint, existing_names))

            if not actions and not remotes:
                log("No Gravitee APIs matched for sync")
                return

            current = hasura_request({"type": "export_metadata", "args": {}})
            merged = merge_metadata(current, actions, remotes)
            metadata_changed = canonical_json(merged) != canonical_json(current)
            if metadata_changed:
                hasura_request({"type": "replace_metadata", "args": merged})

            with ACTION_LOCK:
                ACTION_MAP.clear()
                ACTION_MAP.update(action_mapping)
                ASYNC_POLICY_MAP.clear()
                ASYNC_POLICY_MAP.update(finalize_async_policy_map(async_policy_map))
            if metadata_changed:
                log(
                    "Sync complete: "
                    + f"actions={len(actions)} remote_schemas={len(remotes)} "
                    + f"async_policies={len(ASYNC_POLICY_MAP)}"
                )
            else:
                log(
                    "Sync complete: "
                    + f"actions={len(actions)} remote_schemas={len(remotes)} "
                    + f"async_policies={len(ASYNC_POLICY_MAP)} "
                    + "(no metadata changes)"
                )
        except Exception as exc:
            log(f"sync error: {exc}")
        finally:
            SYNC_LOCK.release()

    def schedule_loop():
        if SYNC_INTERVAL <= 0:
            return
        while True:
            time.sleep(SYNC_INTERVAL)
            sync_once()

    def build_action_url(path_template, input_data):
        path_params = {}
        if isinstance(input_data, dict):
            path_params = input_data.get("path") or {}
        def replace(match):
            key = match.group(1)
            if key in path_params:
                return str(path_params[key])
            if isinstance(input_data, dict) and key in input_data:
                return str(input_data[key])
            return match.group(0)
        path = re.sub(r"{([^}]+)}", replace, path_template)
        if re.search(r"{[^}]+}", path):
            raise ValueError("missing path parameters")
        return path

    def extract_body(input_data):
        if not isinstance(input_data, dict):
            return input_data
        if "body" in input_data:
            return input_data.get("body")
        reserved = {"path", "query", "query_params", "headers"}
        remaining = {k: v for k, v in input_data.items() if k not in reserved}
        return remaining or None

    def extract_query(input_data):
        if not isinstance(input_data, dict):
            return {}
        return input_data.get("query") or input_data.get("query_params") or {}

    def extract_headers(input_data):
        if not isinstance(input_data, dict):
            return {}
        headers = input_data.get("headers") or {}
        return headers if isinstance(headers, dict) else {}

    def load_external_audience():
        now = time.time()
        if _aud_cache["value"] and now - _aud_cache["loaded_at"] < 300:
            return _aud_cache["value"]
        aud = read_file(EXTERNAL_AUDIENCE_PATH)
        if aud:
            _aud_cache["value"] = aud
            _aud_cache["loaded_at"] = now
            return aud
        return None

    def get_jwks_client(url):
        client = _jwks_clients.get(url)
        if client is None:
            client = PyJWKClient(url)
            _jwks_clients[url] = client
        return client

    def get_unverified_jwt_claims(token):
        try:
            claims = jwt.decode(
                token,
                options={
                    "verify_signature": False,
                    "verify_aud": False,
                    "verify_iss": False,
                    "verify_exp": False,
                    "verify_nbf": False,
                },
            )
            return claims if isinstance(claims, dict) else {}
        except Exception:
            return {}

    def get_unverified_jwt_header(token):
        try:
            header = jwt.get_unverified_header(token)
            return header if isinstance(header, dict) else {}
        except Exception:
            return {}

    def decode_jwt(token):
        external_aud = load_external_audience()
        configs = []

        # Keep legacy console-proxy audience support, but also accept the
        # GraphQL API audience for internal-realm service tokens.
        internal_audiences = parse_csv(INTERNAL_AUDIENCE) or [INTERNAL_AUDIENCE]
        if external_aud and external_aud not in internal_audiences:
            internal_audiences.append(external_aud)

        unverified_claims = get_unverified_jwt_claims(token)
        unverified_header = get_unverified_jwt_header(token)
        token_issuer = str(unverified_claims.get("iss") or "").strip()
        token_aud = normalize_claim_value(unverified_claims.get("aud"))
        token_kid = str(unverified_header.get("kid") or "").strip()

        include_internal = token_issuer in ("", INTERNAL_ISSUER)
        include_external = token_issuer in ("", EXTERNAL_ISSUER)

        if include_internal:
            for audience in internal_audiences:
                if audience:
                    configs.append(
                        {"jwk_url": INTERNAL_JWK_URL, "issuer": INTERNAL_ISSUER, "audience": audience}
                    )

        if include_external and external_aud:
            configs.append(
                {"jwk_url": EXTERNAL_JWK_URL, "issuer": EXTERNAL_ISSUER, "audience": external_aud}
            )
        last_error = None
        attempt_errors = []
        for cfg in configs:
            if not cfg["audience"]:
                continue
            try:
                key = get_jwks_client(cfg["jwk_url"]).get_signing_key_from_jwt(token).key
                return jwt_decode(
                    token,
                    key,
                    algorithms=["RS256"],
                    audience=cfg["audience"],
                    issuer=cfg["issuer"],
                    leeway=JWT_CLOCK_SKEW_SECONDS,
                )
            except Exception as exc:
                last_error = exc
                attempt_errors.append(
                    f"{cfg['issuer']} aud={cfg['audience']} err={type(exc).__name__}"
                )
                continue
        if last_error is not None:
            log(
                "auth_decode failed reason="
                + type(last_error).__name__
                + " iss="
                + token_issuer
                + " aud="
                + token_aud
                + " kid="
                + token_kid
                + " attempts="
                + "|".join(attempt_errors[:6])
            )
        return None

    def extract_hasura_claims(claims):
        if not isinstance(claims, dict):
            return {}
        out = {}
        if CLAIMS_NAMESPACE in claims and isinstance(claims[CLAIMS_NAMESPACE], dict):
            out.update(claims[CLAIMS_NAMESPACE])
        parent = claims.get(CLAIMS_PARENT)
        if isinstance(parent, dict):
            nested = parent.get(CLAIMS_CHILD)
            if isinstance(nested, dict):
                out.update(nested)
        # Keycloak mappers often emit flattened keys like:
        #   "https://hasura.io/jwt/claims.x-hasura-default-role": "user"
        # Accept those in addition to the nested-object form.
        prefix = CLAIMS_NAMESPACE + "."
        for key, value in claims.items():
            if not isinstance(key, str):
                continue
            if not key.startswith(prefix):
                continue
            claim_key = key[len(prefix):].strip()
            if not claim_key:
                continue
            if claim_key not in out:
                out[claim_key] = value
        return out

    def normalize_claim_value(value):
        if isinstance(value, (list, dict)):
            return json.dumps(value)
        if value is None:
            return ""
        return str(value)

    def parse_allowed_roles(value):
        if isinstance(value, list):
            return [str(item).strip() for item in value if str(item).strip()]
        if isinstance(value, str):
            text = value.strip()
            if not text:
                return []
            if text.startswith("["):
                try:
                    parsed = json.loads(text)
                    if isinstance(parsed, list):
                        return [str(item).strip() for item in parsed if str(item).strip()]
                except Exception:
                    pass
            return parse_csv(text)
        return []

    def extract_jwt_roles(claims):
        roles = set()

        def add_roles(value):
            if not isinstance(value, list):
                return
            for item in value:
                role = str(item or "").strip()
                if role:
                    roles.add(role)

        if not isinstance(claims, dict):
            return []

        add_roles(claims.get("roles"))

        realm_access = claims.get("realm_access")
        if isinstance(realm_access, dict):
            add_roles(realm_access.get("roles"))

        resource_access = claims.get("resource_access")
        if isinstance(resource_access, dict):
            for resource_claims in resource_access.values():
                if isinstance(resource_claims, dict):
                    add_roles(resource_claims.get("roles"))

        return sorted(roles)

    def build_session_vars(hasura_claims, jwt_roles, traceparent, tracestate, baggage, requested_role=None):
        session = {}
        for key, value in hasura_claims.items():
            if not isinstance(key, str):
                continue
            if key.lower().startswith("x-hasura-"):
                session_key = "X-Hasura-" + key[len("x-hasura-"):]
            else:
                session_key = key
            session[session_key] = normalize_claim_value(value)
        if jwt_roles:
            session["X-Hasura-Auth-Roles"] = normalize_claim_value(jwt_roles)
        if "X-Hasura-Role" not in session:
            role = hasura_claims.get("x-hasura-default-role") or hasura_claims.get("x-hasura-role")
            if role:
                session["X-Hasura-Role"] = normalize_claim_value(role)
        if requested_role:
            allowed_roles = set(parse_allowed_roles(hasura_claims.get("x-hasura-allowed-roles")))
            if requested_role in allowed_roles:
                session["X-Hasura-Role"] = requested_role
        if traceparent:
            session["X-Hasura-Traceparent"] = traceparent
        if tracestate:
            session["X-Hasura-Tracestate"] = tracestate
        if baggage:
            session["X-Hasura-Baggage"] = baggage
        return session

    def parse_traceparent(traceparent_value):
        if not traceparent_value:
            return None, None
        value = traceparent_value.strip()
        match = re.match(r"^[0-9a-f]{2}-([0-9a-f]{32})-([0-9a-f]{16})-[0-9a-f]{2}$", value)
        if not match:
            return None, None
        return match.group(1), match.group(2)

    def normalize_request_headers(headers):
        if isinstance(headers, dict):
            return headers
        if isinstance(headers, list):
            normalized = {}
            for item in headers:
                if not isinstance(item, dict):
                    continue
                name = item.get("name")
                value = item.get("value")
                if name and value is not None:
                    normalized[str(name)] = value
            return normalized
        return {}

    def get_header_value(headers, key):
        if not isinstance(headers, dict):
            return None
        if key in headers:
            return headers.get(key)
        lower_key = key.lower()
        for k, v in headers.items():
            if str(k).lower() == lower_key:
                return v
        return None

    def handle_action(action_name, input_data, auth_header):
        with ACTION_LOCK:
            entry = ACTION_MAP.get(action_name)
        if not entry:
            raise ValueError("action not mapped")
        base_url = entry["base_url"].rstrip("/")
        path = build_action_url(entry["path"], input_data)
        url = f"{base_url}{path}"
        query = extract_query(input_data)
        if query:
            url = f"{url}?{urllib.parse.urlencode(query, doseq=True)}"
        headers = {"Accept": "application/json"}
        if auth_header:
            headers["Authorization"] = auth_header
        headers.update(extract_headers(input_data))
        body = extract_body(input_data)
        data = None
        if body is not None:
            data = json.dumps(body).encode("utf-8")
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=data, headers=headers, method=entry["method"])
        with urlopen(req, timeout=ACTION_TIMEOUT_SECONDS) as resp:
            raw = resp.read().decode("utf-8")
        if not raw:
            return None
        try:
            return json.loads(raw)
        except json.JSONDecodeError:
            return {"raw": raw}

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            return

        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            if self.path.startswith("/auth"):
                auth_header = self.headers.get("Authorization")
                xfwd_token = self.headers.get("X-Forwarded-Access-Token")
                if xfwd_token:
                    token = xfwd_token.strip()
                    if token and not token.lower().startswith("bearer "):
                        token = f"Bearer {token}"
                    auth_header = token
                cf_connecting_ip = self.headers.get("CF-Connecting-IP") or self.headers.get("Cf-Connecting-Ip")
                xff = self.headers.get("X-Forwarded-For") or self.headers.get("x-forwarded-for")
                client_ip = cf_connecting_ip or (xff.split(",", 1)[0].strip() if xff else "")
                request_id = (
                    self.headers.get("X-Request-Id")
                    or self.headers.get("x-request-id")
                    or self.headers.get("CF-Ray")
                    or self.headers.get("Cf-Ray")
                )
                traceparent_hdr = (
                    self.headers.get("traceparent")
                    or self.headers.get("Traceparent")
                    or self.headers.get("x-traceparent")
                    or self.headers.get("X-Traceparent")
                    or self.headers.get("x-forwarded-traceparent")
                    or self.headers.get("X-Forwarded-Traceparent")
                    or self.headers.get("x-oo-traceparent")
                    or self.headers.get("X-Oo-Traceparent")
                )
                if not auth_header or not auth_header.lower().startswith("bearer "):
                    log(
                        "auth_request missing_bearer traceparent="
                        + str(traceparent_hdr)
                        + " client_ip="
                        + str(client_ip)
                        + " request_id="
                        + str(request_id)
                    )
                    self.send_response(401)
                    self.end_headers()
                    return
                token = auth_header.split(" ", 1)[1].strip()
                claims = decode_jwt(token)
                if not claims:
                    log(
                        "auth_request jwt_invalid traceparent="
                        + str(traceparent_hdr)
                        + " client_ip="
                        + str(client_ip)
                        + " request_id="
                        + str(request_id)
                    )
                    self.send_response(401)
                    self.end_headers()
                    return
                hasura_claims = extract_hasura_claims(claims)
                traceparent = (
                    self.headers.get("traceparent")
                    or self.headers.get("Traceparent")
                    or self.headers.get("x-traceparent")
                    or self.headers.get("X-Traceparent")
                    or self.headers.get("x-forwarded-traceparent")
                    or self.headers.get("X-Forwarded-Traceparent")
                    or self.headers.get("x-oo-traceparent")
                    or self.headers.get("X-Oo-Traceparent")
                )
                tracestate = (
                    self.headers.get("tracestate")
                    or self.headers.get("Tracestate")
                    or self.headers.get("x-tracestate")
                    or self.headers.get("X-Tracestate")
                    or self.headers.get("x-forwarded-tracestate")
                    or self.headers.get("X-Forwarded-Tracestate")
                )
                baggage = (
                    self.headers.get("baggage")
                    or self.headers.get("Baggage")
                    or self.headers.get("x-baggage")
                    or self.headers.get("X-Baggage")
                    or self.headers.get("x-forwarded-baggage")
                    or self.headers.get("X-Forwarded-Baggage")
                )
                requested_role = (
                    self.headers.get("x-hasura-role")
                    or self.headers.get("X-Hasura-Role")
                )
                requested_role = str(requested_role or "").strip()
                jwt_roles = extract_jwt_roles(claims)
                session_vars = build_session_vars(
                    hasura_claims,
                    jwt_roles,
                    traceparent,
                    tracestate,
                    baggage,
                    requested_role=requested_role or None,
                )
                if "X-Hasura-Role" not in session_vars:
                    hasura_keys = ",".join(
                        sorted([key for key in hasura_claims.keys() if isinstance(key, str)])[:12]
                    )
                    log(
                        "auth_request missing_role traceparent="
                        + str(traceparent_hdr)
                        + " client_ip="
                        + str(client_ip)
                        + " request_id="
                        + str(request_id)
                        + " aud="
                        + normalize_claim_value(claims.get("aud"))
                        + " azp="
                        + normalize_claim_value(claims.get("azp"))
                        + " hasura_claim_keys="
                        + hasura_keys
                    )
                    self.send_response(401)
                    self.end_headers()
                    return
                log(
                    "auth_request ok traceparent="
                    + str(traceparent_hdr)
                    + " client_ip="
                    + str(client_ip)
                    + " request_id="
                    + str(request_id)
                )
                body = json.dumps(session_vars).encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return
            self.send_response(404)
            self.end_headers()

        def do_POST(self):
            length = int(self.headers.get("Content-Length", "0"))
            body = self.rfile.read(length) if length else b""
            if self.path.startswith("/async-policy/authorize"):
                try:
                    payload = json.loads(body.decode("utf-8") or "{}")
                    if not isinstance(payload, dict):
                        raise ValueError("payload must be a JSON object")
                    role = payload.get("role")
                    handler = payload.get("handler")
                    operation = payload.get("operation")
                    required_role = payload.get("required_role") or payload.get("requiredRole")
                    allowed_roles = payload.get("allowed_roles")
                    allowed_roles = parse_allowed_roles(allowed_roles)
                    allowed, source = authorize_async_route(
                        role,
                        handler,
                        operation,
                        allowed_roles,
                        required_role=required_role,
                    )
                    response = {"allowed": bool(allowed), "source": str(source)}
                    data = json.dumps(response).encode("utf-8")
                    self.send_response(200 if allowed else 403)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(data)))
                    self.end_headers()
                    self.wfile.write(data)
                except Exception as exc:
                    data = json.dumps({"allowed": False, "error": str(exc)}).encode("utf-8")
                    self.send_response(400)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(data)))
                    self.end_headers()
                    self.wfile.write(data)
                return
            if self.path.startswith("/webhook"):
                secret = read_file(WEBHOOK_SECRET_PATH)
                if secret:
                    token = self.headers.get("X-Webhook-Token", "") or self.headers.get("X-Gravitee-Token", "")
                    if token != secret:
                        self.send_response(403)
                        self.end_headers()
                        return
                threading.Thread(target=sync_once, daemon=True).start()
                self.send_response(202)
                self.end_headers()
                return
            if self.path.startswith("/action"):
                try:
                    payload = json.loads(body.decode("utf-8") or "{}")
                    action_name = payload.get("action", {}).get("name")
                    input_data = payload.get("input") or {}
                    if (
                        isinstance(input_data, dict)
                        and "input" in input_data
                        and len(input_data) == 1
                        and isinstance(input_data.get("input"), dict)
                    ):
                        input_data = input_data["input"]
                    request_headers_payload = normalize_request_headers(
                        (payload.get("request") or {}).get("headers")
                    )
                    if not request_headers_payload:
                        request_headers_payload = normalize_request_headers(
                            payload.get("request_headers")
                        )
                    if not request_headers_payload:
                        request_headers_payload = normalize_request_headers(
                            payload.get("headers")
                        )
                    payload_request = payload.get("request") if isinstance(payload, dict) else None
                    request_keys = payload_request.keys() if isinstance(payload_request, dict) else []
                    request_headers_raw = (
                        payload_request.get("headers") if isinstance(payload_request, dict) else None
                    )
                    log(
                        "action="
                        + str(action_name)
                        + " payload_keys="
                        + ",".join(sorted([str(k) for k in payload.keys()]))
                        + " request_keys="
                        + ",".join(sorted([str(k) for k in request_keys]))
                        + " request_headers_type="
                        + str(type(request_headers_raw).__name__)
                        + " request_headers_present="
                        + str(bool(request_headers_raw))
                        + " payload_header_keys="
                        + ",".join(sorted([str(k) for k in request_headers_payload.keys()]))
                    )
                    auth_header = self.headers.get("Authorization")
                    xfwd_token = self.headers.get("X-Forwarded-Access-Token")
                    if xfwd_token:
                        token = xfwd_token.strip()
                        if token and not token.lower().startswith("bearer "):
                            token = f"Bearer {token}"
                        auth_header = token
                    if not action_name:
                        raise ValueError("missing action name")
                    incoming_headers = self.headers
                    log(
                        "action="
                        + str(action_name)
                        + " incoming_header_keys="
                        + ",".join(sorted([str(k) for k in incoming_headers.keys()]))
                    )
                    cf_connecting_ip = (
                        incoming_headers.get("CF-Connecting-IP")
                        or incoming_headers.get("Cf-Connecting-Ip")
                        or get_header_value(request_headers_payload, "cf-connecting-ip")
                    )
                    cf_ray = (
                        incoming_headers.get("CF-Ray")
                        or incoming_headers.get("Cf-Ray")
                        or get_header_value(request_headers_payload, "cf-ray")
                    )
                    cf_ip_country = (
                        incoming_headers.get("CF-IPCountry")
                        or incoming_headers.get("Cf-IPCountry")
                        or get_header_value(request_headers_payload, "cf-ipcountry")
                    )
                    cf_visitor = (
                        incoming_headers.get("CF-Visitor")
                        or incoming_headers.get("Cf-Visitor")
                        or get_header_value(request_headers_payload, "cf-visitor")
                    )
                    request_id = (
                        incoming_headers.get("x-request-id")
                        or incoming_headers.get("X-Request-Id")
                        or get_header_value(request_headers_payload, "x-request-id")
                        or cf_ray
                    )
                    if request_id:
                        log(
                            "action="
                            + str(action_name)
                            + " x_request_id="
                            + str(request_id)
                        )
                    traceparent_from_request_id = request_id.strip() if request_id else None
                    session_vars = payload.get("session_variables") if isinstance(payload, dict) else None
                    if not isinstance(session_vars, dict):
                        session_vars = {}
                    if session_vars:
                        log(
                            "action="
                            + str(action_name)
                            + " session_var_keys="
                            + ",".join(sorted([str(k) for k in session_vars.keys()]))
                        )
                    traceparent = (
                        incoming_headers.get("traceparent")
                        or incoming_headers.get("Traceparent")
                        or incoming_headers.get("x-traceparent")
                        or incoming_headers.get("X-Traceparent")
                        or incoming_headers.get("x-forwarded-traceparent")
                        or incoming_headers.get("X-Forwarded-Traceparent")
                        or incoming_headers.get("x-oo-traceparent")
                        or incoming_headers.get("X-Oo-Traceparent")
                        or get_header_value(request_headers_payload, "traceparent")
                        or get_header_value(session_vars, "x-hasura-traceparent")
                        or get_header_value(request_headers_payload, "x-oo-traceparent")
                        or get_header_value(session_vars, "x-oo-traceparent")
                    )
                    tracestate = (
                        incoming_headers.get("tracestate")
                        or incoming_headers.get("Tracestate")
                        or incoming_headers.get("x-tracestate")
                        or incoming_headers.get("X-Tracestate")
                        or incoming_headers.get("x-forwarded-tracestate")
                        or incoming_headers.get("X-Forwarded-Tracestate")
                        or get_header_value(request_headers_payload, "tracestate")
                        or get_header_value(session_vars, "x-hasura-tracestate")
                    )
                    baggage = (
                        incoming_headers.get("baggage")
                        or incoming_headers.get("Baggage")
                        or incoming_headers.get("x-baggage")
                        or incoming_headers.get("X-Baggage")
                        or incoming_headers.get("x-forwarded-baggage")
                        or incoming_headers.get("X-Forwarded-Baggage")
                        or get_header_value(request_headers_payload, "baggage")
                        or get_header_value(session_vars, "x-hasura-baggage")
                    )
                    if not traceparent and traceparent_from_request_id:
                        if re.match(r"^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$", traceparent_from_request_id):
                            traceparent = traceparent_from_request_id
                    forwarded = {
                        "X-Forwarded-For": (
                            incoming_headers.get("X-Forwarded-For")
                            or get_header_value(request_headers_payload, "x-forwarded-for")
                            or cf_connecting_ip
                        ),
                        "X-Client-IP": (
                            incoming_headers.get("X-Client-IP")
                            or get_header_value(request_headers_payload, "x-client-ip")
                            or cf_connecting_ip
                        ),
                        "X-Real-IP": (
                            incoming_headers.get("X-Real-IP")
                            or get_header_value(request_headers_payload, "x-real-ip")
                            or cf_connecting_ip
                        ),
                        "X-Forwarded-Proto": (
                            incoming_headers.get("X-Forwarded-Proto")
                            or get_header_value(request_headers_payload, "x-forwarded-proto")
                        ),
                        "X-Forwarded-Host": (
                            incoming_headers.get("X-Forwarded-Host")
                            or get_header_value(request_headers_payload, "x-forwarded-host")
                        ),
                        "CF-Connecting-IP": cf_connecting_ip,
                        "CF-Ray": cf_ray,
                        "CF-IPCountry": cf_ip_country,
                        "CF-Visitor": cf_visitor,
                    }
                    if request_id:
                        forwarded["X-Request-Id"] = request_id
                    if traceparent:
                        forwarded["Traceparent"] = traceparent
                    trace_id, span_id = parse_traceparent(traceparent)
                    if trace_id:
                        forwarded["X-Trace-Id"] = trace_id
                    if span_id:
                        forwarded["X-Span-Id"] = span_id
                    if tracestate:
                        forwarded["Tracestate"] = tracestate
                    if baggage:
                        forwarded["Baggage"] = baggage
                    input_headers = input_data.get("headers") if isinstance(input_data, dict) else None
                    if not isinstance(input_headers, dict):
                        input_headers = {}
                    for key, value in forwarded.items():
                        if value and key not in input_headers:
                            input_headers[key] = value
                    user_claims = extract_user_claims(auth_header)
                    if user_claims.get("user_id") and "X-User-Id" not in input_headers:
                        input_headers["X-User-Id"] = str(user_claims["user_id"])
                    if user_claims.get("user_email") and "X-User-Email" not in input_headers:
                        input_headers["X-User-Email"] = str(user_claims["user_email"])
                    if user_claims.get("user_username") and "X-User-Username" not in input_headers:
                        input_headers["X-User-Username"] = str(user_claims["user_username"])
                    if user_claims.get("user_issuer") and "X-User-Issuer" not in input_headers:
                        input_headers["X-User-Issuer"] = str(user_claims["user_issuer"])
                    input_data["headers"] = input_headers
                    log(
                        "action="
                        + str(action_name)
                        + " xff="
                        + str(input_headers.get("X-Forwarded-For", ""))
                        + " client_ip="
                        + str(input_headers.get("X-Client-IP", ""))
                        + " cf_connecting_ip="
                        + str(input_headers.get("CF-Connecting-IP", ""))
                        + " request_id="
                        + str(input_headers.get("X-Request-Id", ""))
                        + " cf_ray="
                        + str(input_headers.get("CF-Ray", ""))
                        + " user_id="
                        + str(user_claims.get("user_id", ""))
                        + " user_email="
                        + str(user_claims.get("user_email", ""))
                    )
                    result = handle_action(action_name, input_data, auth_header)
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps(result).encode("utf-8"))
                except urllib.error.HTTPError as exc:
                    status = exc.code
                    raw = exc.read()
                    text = raw.decode("utf-8", errors="replace") if raw else ""
                    upstream = {"status": status, "url": getattr(exc, "url", None) or exc.geturl()}
                    if text:
                        try:
                            upstream_body = json.loads(text)
                        except json.JSONDecodeError:
                            upstream_body = text
                        upstream["body"] = upstream_body
                    www_auth = exc.headers.get("WWW-Authenticate") if exc.headers else None
                    if www_auth:
                        upstream["www_authenticate"] = www_auth
                    detail = None
                    if isinstance(upstream.get("body"), dict):
                        detail = upstream["body"].get("detail")
                    message = f"Upstream HTTP {status}"
                    if detail:
                        message = f"Upstream HTTP {status}: {detail}"
                    payload = {
                        "message": message,
                        "extensions": {
                            "code": "upstream_http_error",
                            "upstream": upstream,
                        },
                    }
                    self.send_response(status)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps(payload).encode("utf-8"))
                except Exception as exc:
                    self.send_response(502)
                    self.send_header("Content-Type", "application/json")
                    self.end_headers()
                    self.wfile.write(json.dumps({"error": str(exc)}).encode("utf-8"))
                return
            self.send_response(404)
            self.end_headers()

    def main():
        log("Starting Gravitee → Hasura syncer")
        sync_once()
        threading.Thread(target=schedule_loop, daemon=True).start()
        server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
        server.serve_forever()

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gravitee-sync
  namespace: graphql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphql-gravitee-sync
  template:
    metadata:
      labels:
        app: graphql-gravitee-sync
      annotations:
        reloader.stakater.com/auto: "true"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "graphql-gravitee-sync"
        vault.hashicorp.com/agent-inject-secret-hasura-admin: "secret/data/graphql/hasura-admin"
        vault.hashicorp.com/agent-inject-template-hasura-admin: |
          {{- with secret "secret/data/graphql/hasura-admin" -}}
          {{- if .Data.data.value -}}
          {{ .Data.data.value }}
          {{- else -}}
          {{ .Data.data.admin_secret }}
          {{- end -}}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-gravitee-admin-username: "secret/data/gravitee/admin-credentials"
        vault.hashicorp.com/agent-inject-template-gravitee-admin-username: |
          {{- with secret "secret/data/gravitee/admin-credentials" -}}
          {{ .Data.data.username }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-gravitee-admin-password: "secret/data/gravitee/admin-credentials"
        vault.hashicorp.com/agent-inject-template-gravitee-admin-password: |
          {{- with secret "secret/data/gravitee/admin-credentials" -}}
          {{ .Data.data.password }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-gravitee-webhook-secret: "secret/data/gravitee-webhook-secret"
        vault.hashicorp.com/agent-inject-template-gravitee-webhook-secret: |
          {{- with secret "secret/data/gravitee-webhook-secret" -}}
          {{ .Data.data.value }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-graphql-api-client-id: "secret/data/keycloak-client-id-graphql-api"
        vault.hashicorp.com/agent-inject-template-graphql-api-client-id: |
          {{- with secret "secret/data/keycloak-client-id-graphql-api" -}}
          {{ .Data.data.value }}
          {{- end }}
        linkerd.io/inject: "enabled"
    spec:
      serviceAccountName: graphql-gravitee-sync
      containers:
        - name: sync
          image: python:3.11-slim
          ports:
            - containerPort: 8080
          env:
            - name: HASURA_URL
              value: "http://hasura.graphql.svc.cluster.local:8080"
            - name: HASURA_ADMIN_SECRET_PATH
              value: "/vault/secrets/hasura-admin"
            - name: GRAVITEE_MANAGEMENT_API
              value: "http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083/management"
            - name: GRAVITEE_ORG
              value: "DEFAULT"
            - name: GRAVITEE_ENV
              value: "DEFAULT"
            - name: GRAVITEE_GATEWAY_URL
              value: "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082"
            - name: GRAVITEE_ADMIN_USERNAME_PATH
              value: "/vault/secrets/gravitee-admin-username"
            - name: GRAVITEE_ADMIN_PASSWORD_PATH
              value: "/vault/secrets/gravitee-admin-password"
            - name: WEBHOOK_SECRET_PATH
              value: "/vault/secrets/gravitee-webhook-secret"
            - name: HASURA_OPT_IN_TAGS
              value: "hasura"
            - name: HASURA_ENDPOINT_LABEL
              value: "hasura.endpoint"
            - name: HASURA_MODE_LABEL
              value: "hasura.mode"
            - name: HASURA_ACTION_ROLES_LABEL
              value: "hasura.action.roles"
            - name: ASYNC_HANDLER_LABEL
              value: "hasura.async.handler"
            - name: ASYNC_HANDLERS_LABEL
              value: "hasura.async.handlers"
            - name: ASYNC_OPERATION_ROLES_LABEL_PREFIX
              value: "hasura.async.operation.roles."
            - name: ASYNC_POLICY_DEFAULT_ALLOW
              value: "true"
            - name: ACTION_HANDLER_URL
              value: "http://graphql-gravitee-sync.graphql.svc.cluster.local:8080/action"
            - name: SYNC_INTERVAL
              value: "60"
            - name: JWT_CLOCK_SKEW_SECONDS
              value: "60"
            - name: ACTION_TIMEOUT_SECONDS
              value: "30"
            - name: REMOTE_SCHEMA_TIMEOUT_SECONDS
              value: "60"
            - name: INTERNAL_JWK_URL
              value: "https://auth.suncoast.systems/realms/internal/protocol/openid-connect/certs"
            - name: INTERNAL_ISSUER
              value: "https://auth.suncoast.systems/realms/internal"
            - name: INTERNAL_AUDIENCE
              value: "hasura-console-proxy"
            - name: EXTERNAL_JWK_URL
              value: "https://auth.suncoast.systems/realms/external/protocol/openid-connect/certs"
            - name: EXTERNAL_ISSUER
              value: "https://auth.suncoast.systems/realms/external"
            - name: EXTERNAL_AUDIENCE_PATH
              value: "/vault/secrets/graphql-api-client-id"
          volumeMounts:
            - name: script
              mountPath: /app
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              python -m pip install --no-cache-dir "pyjwt[crypto]" >/tmp/pip-auth-hook.log 2>&1
              python /app/sync.py
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: script
          configMap:
            name: graphql-gravitee-sync
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gravitee-sync
  namespace: graphql
spec:
  selector:
    app: graphql-gravitee-sync
  ports:
    - name: http
      port: 8080
      targetPort: 8080
