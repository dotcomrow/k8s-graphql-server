apiVersion: v1
kind: ConfigMap
metadata:
  name: hasura-config
  namespace: graphql
data:
  hasura.env: |
    # Generated by scripts/hasura/generate_hasura_config.py
    # Image: hasura/graphql-engine:v2.38.0
    # Generated (UTC): 2026-02-09T22:23:56Z
    #
    # This file is sourced by the Hasura container in manifests/hasura.yaml.
    # Env vars set directly on the Deployment container take precedence; this file provides defaults.
    # It is stored in a Kubernetes ConfigMap (NOT a Secret). Do not put secrets here.
    #
    # Regenerate after upgrading the Hasura image:
    #   python3 scripts/hasura/generate_hasura_config.py
    #
    # NOTE: Redis connection env vars (HASURA_GRAPHQL_*_REDIS_*) are configured
    # via Vault injection in manifests/hasura.yaml and are intentionally omitted
    # from this file/ConfigMap.
    #
    # --- Database ---
    # HASURA_GRAPHQL_CONNECTIONS_PER_READ_REPLICA
    # Maximum number of Postgres connections per read-replica that can be opened per stripe
    # (default: 50). When the maximum is reached we will block until a new connection becomes
    # available, even if there is capacity in other stripes.
    HASURA_GRAPHQL_CONNECTIONS_PER_READ_REPLICA='50'

    # HASURA_GRAPHQL_DATABASE_URL
    # Postgres database URL. Example postgres://foo:bar@example.com:2345/database
    # HASURA_GRAPHQL_DATABASE_URL='<set-via-vault-or-secret>'

    # HASURA_GRAPHQL_METADATA_DATABASE_URL
    # Postgres database URL for Metadata storage. Example
    # postgres://foo:bar@example.com:2345/database This can also be a URI of the form
    # 'dynamic-from-file:///path/to/file', where the referenced file contains a postgres
    # connection string, which will be read dynamically every time a new connection is
    # established.
    # HASURA_GRAPHQL_METADATA_DATABASE_URL=

    # HASURA_GRAPHQL_NO_OF_RETRIES
    # No.of retries if Postgres connection error occurs (default: 1)
    HASURA_GRAPHQL_NO_OF_RETRIES='1'

    # HASURA_GRAPHQL_PG_CONNECTIONS
    # Maximum number of Postgres connections that can be opened per stripe (default: 50). When
    # the maximum is reached we will block until a new connection becomes available, even if
    # there is capacity in other stripes.
    HASURA_GRAPHQL_PG_CONNECTIONS='50'

    # HASURA_GRAPHQL_PG_CONN_LIFETIME
    # Time from connection creation after which the connection should be destroyed and a new one
    # created. A value of 0 indicates we should never destroy an active connection. If 0 is
    # passed, memory from large query results may not be reclaimed. (default: 600 sec)
    HASURA_GRAPHQL_PG_CONN_LIFETIME='600'

    # HASURA_GRAPHQL_PG_POOL_TIMEOUT
    # How long to wait when acquiring a Postgres connection, in seconds (default: forever).
    # HASURA_GRAPHQL_PG_POOL_TIMEOUT=

    # HASURA_GRAPHQL_PG_SSL_CERTIFICATE_PATH
    # Path for storage of postgres SSL certificates when set via environment variable reference.
    # HASURA_GRAPHQL_PG_SSL_CERTIFICATE_PATH=

    # HASURA_GRAPHQL_PG_STRIPES
    # Number of stripes (distinct sub-pools) to maintain with Postgres (default: 1). New
    # connections will be taken from a particular stripe pseudo-randomly.
    HASURA_GRAPHQL_PG_STRIPES='1'

    # HASURA_GRAPHQL_PG_TIMEOUT
    # Each connection's idle time before it is closed (default: 180 sec)
    HASURA_GRAPHQL_PG_TIMEOUT='180'

    # HASURA_GRAPHQL_READ_REPLICA_URLS
    # Comma separated list of URLs of read-replicas for the database
    # HASURA_GRAPHQL_READ_REPLICA_URLS=

    # HASURA_GRAPHQL_STRIPES_PER_READ_REPLICA
    # Number of stripes (distinct sub-pools) for each read-replica instance to maintain with
    # Postgres (default: 1). New connections will be taken from a particular stripe
    # pseudo-randomly.
    HASURA_GRAPHQL_STRIPES_PER_READ_REPLICA='1'

    # HASURA_GRAPHQL_TX_ISOLATION
    # transaction isolation. read-committed / repeatable-read / serializable (default:
    # read-commited)
    HASURA_GRAPHQL_TX_ISOLATION='read-committed'

    # HASURA_GRAPHQL_USE_PREPARED_STATEMENTS
    # Use prepared statements for queries (default: true)
    HASURA_GRAPHQL_USE_PREPARED_STATEMENTS='true'


    # --- Server ---
    # HASURA_GRAPHQL_MAX_TOTAL_HEADER_LENGTH
    # Max cumulative length of all headers in bytes (Default: 1MB)
    HASURA_GRAPHQL_MAX_TOTAL_HEADER_LENGTH='1048576'

    # HASURA_GRAPHQL_SERVER_HOST
    # Host on which graphql-engine will listen (default: *)
    HASURA_GRAPHQL_SERVER_HOST='*'

    # HASURA_GRAPHQL_SERVER_PORT
    # Port on which graphql-engine should be served (default: 8080)
    HASURA_GRAPHQL_SERVER_PORT='8080'


    # --- Auth ---
    # HASURA_GRAPHQL_ADMIN_INTERNAL_ERRORS
    # Enables including 'internal' information in an error response for requests made by an
    # 'admin' (default: true)
    HASURA_GRAPHQL_ADMIN_INTERNAL_ERRORS='true'

    # HASURA_GRAPHQL_ADMIN_SECRET
    # Admin Secret key, required to access this instance
    # HASURA_GRAPHQL_ADMIN_SECRET='<set-via-vault-or-secret>'

    # HASURA_GRAPHQL_ADMIN_SECRETS
    # List of Admin Secret keys, required to access this instance
    # HASURA_GRAPHQL_ADMIN_SECRETS=

    # HASURA_GRAPHQL_AUTH_HOOK
    # URL of the authorization webhook required to authorize requests
    HASURA_GRAPHQL_AUTH_HOOK='http://graphql-gravitee-sync.graphql.svc.cluster.local:8080/auth'

    # HASURA_GRAPHQL_AUTH_HOOK_MODE
    # HTTP method to use for authorization webhook (default: GET)
    HASURA_GRAPHQL_AUTH_HOOK_MODE='GET'

    # HASURA_GRAPHQL_AUTH_HOOK_SEND_REQUEST_BODY
    # Send request body in POST method (default: true)
    HASURA_GRAPHQL_AUTH_HOOK_SEND_REQUEST_BODY='true'

    # HASURA_GRAPHQL_AUTH_HOOK_TYPE
    # Authorization webhook type/transport. This is an internal/legacy knob in some builds;
    # prefer configuring `HASURA_GRAPHQL_AUTH_HOOK` + `HASURA_GRAPHQL_AUTH_HOOK_MODE`.
    # HASURA_GRAPHQL_AUTH_HOOK_TYPE=

    # HASURA_GRAPHQL_JWT_SECRET
    # The JSON containing type and the JWK used for verifying. e.g: `{"type": "HS256", "key":
    # "<your-hmac-shared-secret>", "claims_namespace":
    # "<optional-custom-claims-key-name>"}`,`{"type": "RS256", "key":
    # "<your-PEM-RSA-public-key>", "claims_namespace": "<optional-custom-claims-key-name>"}`
    # HASURA_GRAPHQL_JWT_SECRET=

    # HASURA_GRAPHQL_JWT_SECRETS
    # A JSON array of objects containing type and the JWK used for verifying. e.g: `[{"type":
    # "HS256", "key": "<your-hmac-shared-secret>", "claims_namespace":
    # "<optional-custom-claims-key-name>"},{"type": "RS256", "issuer": "my-issuer", "key":
    # "<your-PEM-RSA-public-key>", "claims_namespace": "<optional-custom-claims-key-name>"}]`
    # HASURA_GRAPHQL_JWT_SECRETS=

    # HASURA_GRAPHQL_UNAUTHORIZED_ROLE
    # Unauthorized role, used when admin-secret is not sent in admin-secret only mode or
    # "Authorization" header is absent in JWT mode
    # HASURA_GRAPHQL_UNAUTHORIZED_ROLE=


    # --- CORS ---
    # HASURA_GRAPHQL_CORS_DOMAIN
    # CSV of list of domains, excluding scheme (http/https) and including port, to allow CORS
    # for. Wildcard domains are allowed. See docs for details.
    # HASURA_GRAPHQL_CORS_DOMAIN=

    # HASURA_GRAPHQL_DISABLE_CORS
    # Disable CORS. Do not send any CORS headers on any request
    HASURA_GRAPHQL_DISABLE_CORS='false'


    # --- Console ---
    # HASURA_GRAPHQL_CONSOLE_ASSETS_DIR
    # A directory from which static assets required for console is served at'/console/assets'
    # path. Can be set to '/srv/console-assets' on the default docker image to disable loading
    # assets from CDN.
    # HASURA_GRAPHQL_CONSOLE_ASSETS_DIR=

    # HASURA_GRAPHQL_ENABLE_CONSOLE
    # Enable API Console (default: false)
    HASURA_GRAPHQL_ENABLE_CONSOLE='true'


    # --- Logging ---
    # HASURA_GRAPHQL_DEV_MODE
    # Set dev mode for GraphQL requests; include 'internal' key in the errors extensions (if
    # required) of the response
    HASURA_GRAPHQL_DEV_MODE='false'

    # HASURA_GRAPHQL_ENABLED_LOG_TYPES
    # Comma separated list of enabled log types (default:
    # jwk-refresh-log,webhook-log,http-log,startup,websocket-log)(all:
    # startup,http-log,webhook-log,websocket-log,query-log,execution-log,livequery-poller-log,action-handler-log,data-connector-log,jwk-refresh-log,validate-insert-input-log)
    HASURA_GRAPHQL_ENABLED_LOG_TYPES='startup, http-log, websocket-log, query-log'

    # HASURA_GRAPHQL_ENABLE_METADATA_QUERY_LOGGING
    # Enables the query field in http-logs for metadata queries (default: false)
    HASURA_GRAPHQL_ENABLE_METADATA_QUERY_LOGGING='false'

    # HASURA_GRAPHQL_ENABLE_TRIGGERS_ERROR_LOG_LEVEL
    # Set log-level as error for Trigger error logs (Event Triggers, Scheduled Triggers, Cron
    # Triggers) (default: false).
    HASURA_GRAPHQL_ENABLE_TRIGGERS_ERROR_LOG_LEVEL='false'

    # HASURA_GRAPHQL_LOG_LEVEL
    # Server log level (default: info) (all: error, warn, info, debug)
    HASURA_GRAPHQL_LOG_LEVEL='info'

    # HASURA_GRAPHQL_PRO_ENABLE_LOG_COMPRESSION
    # Enable sending compressed logs to metrics server
    # HASURA_GRAPHQL_PRO_ENABLE_LOG_COMPRESSION=

    # LUX_DISABLE_LOG_SENDER
    # Disable log sending to Lux for metrics (default: false)
    LUX_DISABLE_LOG_SENDER='false'


    # --- Events ---
    # HASURA_GRAPHQL_ASYNC_ACTIONS_FETCH_BATCH_SIZE
    # Number of requests processed at a time in asynchronous actions (Default: 10)
    HASURA_GRAPHQL_ASYNC_ACTIONS_FETCH_BATCH_SIZE='10'

    # HASURA_GRAPHQL_ASYNC_ACTIONS_FETCH_INTERVAL
    # Interval in milliseconds to sleep before trying to fetch new async actions. Value "0"
    # implies completely disable fetching async actions from storage. Default 1000 milliseconds
    HASURA_GRAPHQL_ASYNC_ACTIONS_FETCH_INTERVAL='1000'

    # HASURA_GRAPHQL_EVENTS_FETCH_BATCH_SIZE
    # The maximum number of events to be fetched from the events table in a single batch.
    # Default 100Value "0" implies completely disable fetching events from events table.
    # HASURA_GRAPHQL_EVENTS_FETCH_BATCH_SIZE=

    # HASURA_GRAPHQL_EVENTS_FETCH_INTERVAL
    # Interval in milliseconds to sleep before trying to fetch events again after a fetch
    # returned no events from postgres (default: 1 second).
    HASURA_GRAPHQL_EVENTS_FETCH_INTERVAL='1000'

    # HASURA_GRAPHQL_EVENTS_HTTP_POOL_SIZE
    # Max event processing threads (default: 100)
    HASURA_GRAPHQL_EVENTS_HTTP_POOL_SIZE='100'


    # --- Subscriptions ---
    # HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE
    # multiplexed live queries are split into batches of the specified size. Default 100.
    HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE='100'

    # HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL
    # results will only be sent once in this interval (in milliseconds) for live queries which
    # can be multiplexed. Default: 1000 (1sec)
    HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL='1000'

    # HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_BATCH_SIZE
    # multiplexed live queries are split into batches of the specified size. Default 100.
    HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_BATCH_SIZE='100'

    # HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_REFETCH_INTERVAL
    # results will only be sent once in this interval (in milliseconds) for streaming queries
    # which can be multiplexed. Default: 1000 (1sec)
    HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_REFETCH_INTERVAL='1000'


    # --- WebSocket ---
    # HASURA_GRAPHQL_CONNECTION_COMPRESSION
    # Enable WebSocket permessage-deflate compression (default: false)
    HASURA_GRAPHQL_CONNECTION_COMPRESSION='false'

    # HASURA_GRAPHQL_WEBSOCKET_CONNECTION_INIT_TIMEOUT
    # Control websocket connection_init timeout (default 3 seconds)
    # HASURA_GRAPHQL_WEBSOCKET_CONNECTION_INIT_TIMEOUT=

    # HASURA_GRAPHQL_WEBSOCKET_KEEPALIVE
    # Control websocket keep-alive timeout (default 5 seconds)
    # HASURA_GRAPHQL_WEBSOCKET_KEEPALIVE=

    # HASURA_GRAPHQL_WS_READ_COOKIE
    # Read cookie on WebSocket initial handshake, even when CORS is disabled. This can be a
    # potential security flaw! Please make sure you know what you're doing. This configuration
    # is only applicable when CORS is disabled.
    HASURA_GRAPHQL_WS_READ_COOKIE='false'


    # --- Behavior ---
    # HASURA_GRAPHQL_BACKWARDS_COMPAT_NULL_IN_NONNULLABLE_VARIABLES
    # Backwards-compatibility switch for older behavior regarding nulls in non-nullable
    # variables (legacy/compat mode).
    # HASURA_GRAPHQL_BACKWARDS_COMPAT_NULL_IN_NONNULLABLE_VARIABLES=

    # HASURA_GRAPHQL_CONFIGURED_HEADER_PRECEDENCE
    # Forward configured metadata headers with higher precedence than client headerswhen
    # delivering payload to webhook for actions and input validations. (default: false)
    HASURA_GRAPHQL_CONFIGURED_HEADER_PRECEDENCE='false'

    # HASURA_GRAPHQL_DEFAULT_NAMING_CONVENTION
    # No help text available for this setting.
    # HASURA_GRAPHQL_DEFAULT_NAMING_CONVENTION=

    # HASURA_GRAPHQL_ENABLE_ALLOWLIST
    # Only accept allowed GraphQL queries
    HASURA_GRAPHQL_ENABLE_ALLOWLIST='false'

    # HASURA_GRAPHQL_ENABLE_APOLLO_FEDERATION
    # Enable Apollo Federation (default: false). This will allow hasura to be used as a subgraph
    # in an Apollo gateway
    HASURA_GRAPHQL_ENABLE_APOLLO_FEDERATION='false'

    # HASURA_GRAPHQL_ENABLE_MAINTENANCE_MODE
    # Flag to enable maintenance mode in the graphql-engine
    HASURA_GRAPHQL_ENABLE_MAINTENANCE_MODE='false'

    # HASURA_GRAPHQL_ENABLE_PERSISTED_QUERIES
    # Enable automated persisted queries (default: false).
    HASURA_GRAPHQL_ENABLE_PERSISTED_QUERIES='false'

    # HASURA_GRAPHQL_ENABLE_REMOTE_SCHEMA_PERMISSIONS
    # Enables remote schema permissions (default: false)
    HASURA_GRAPHQL_ENABLE_REMOTE_SCHEMA_PERMISSIONS='false'

    # HASURA_GRAPHQL_ENABLE_TELEMETRY
    # Enable anonymous telemetry on the server and console. For more information, see:
    # https://hasura.io/docs/latest/guides/telemetry (default: true)
    HASURA_GRAPHQL_ENABLE_TELEMETRY='true'

    # HASURA_GRAPHQL_EXPERIMENTAL_FEATURES
    # Comma separated list of experimental features. (all:
    # inherited_roles,optimize_permission_filters and naming_convention,
    # streaming_subscriptions, apollo_federation). optimize_permission_filters: Use experimental
    # SQL optimizationtransformations for permission filters. inherited_roles: ignored;
    # inherited roles cannot be switched offnaming_convention: apply naming convention
    # (graphql-default/hasura-default) based on source customizationapollo_federation: use
    # hasura as a subgraph in an Apollo gateway (deprecated)streaming_subscriptions: A streaming
    # subscription streams the response according to the cursor provided by the user
    # HASURA_GRAPHQL_EXPERIMENTAL_FEATURES=

    # HASURA_GRAPHQL_GRACEFUL_SHUTDOWN_TIMEOUT
    # No help text available for this setting.
    # HASURA_GRAPHQL_GRACEFUL_SHUTDOWN_TIMEOUT=

    # HASURA_GRAPHQL_INFER_FUNCTION_PERMISSIONS
    # Infers function permissions (default: true)
    HASURA_GRAPHQL_INFER_FUNCTION_PERMISSIONS='true'

    # HASURA_GRAPHQL_METADATA_DATABASE_EXTENSIONS_SCHEMA
    # Name of the schema where Hasura can install database extensions. Default: public
    HASURA_GRAPHQL_METADATA_DATABASE_EXTENSIONS_SCHEMA='public'

    # HASURA_GRAPHQL_REMOTE_SCHEMA_PRIORITIZE_DATA
    # Prefer data from the remote schema when there are field conflicts. This is a niche
    # compatibility knob; leave unset unless needed.
    # HASURA_GRAPHQL_REMOTE_SCHEMA_PRIORITIZE_DATA=

    # HASURA_GRAPHQL_REMOTE_SCHEMA_SKIP_NULLS
    # Skip null values from arguments while resolving fields from remote schemas. (default:
    # false, i.e. forward null values in argument as well)
    HASURA_GRAPHQL_REMOTE_SCHEMA_SKIP_NULLS='false'

    # HASURA_GRAPHQL_SCHEMA_SYNC_POLL_INTERVAL
    # No help text available for this setting.
    # HASURA_GRAPHQL_SCHEMA_SYNC_POLL_INTERVAL=

    # HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES
    # Stringify numeric types (default: false)
    HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES='false'

    # HASURA_GRAPHQL_V1_BOOLEAN_NULL_COLLAPSE
    # Emulate V1's behaviour re. boolean expression, where an explicit 'null' value will be
    # interpreted to mean that the field should be ignored [DEPRECATED, WILL BE REMOVED SOON]
    # (default: false)
    HASURA_GRAPHQL_V1_BOOLEAN_NULL_COLLAPSE='false'


    # --- Redis/Cache ---
    # HASURA_GRAPHQL_CACHE_BUCKET_RATE
    # Recharge rate for the Query Response Cache token bucket. See
    # https://hasura.io/docs/latest/queries/response-caching for more info. Default: 10,000,000
    # bytes/second (10 MB/s)
    HASURA_GRAPHQL_CACHE_BUCKET_RATE='10000000'

    # HASURA_GRAPHQL_CACHE_BUCKET_SIZE
    # Maximum capacity in bytes for the Query Response Cache token bucket algorithm. See
    # https://hasura.io/docs/latest/queries/response-caching for more info. Default: 1000000000
    # bytes (1 GB)
    HASURA_GRAPHQL_CACHE_BUCKET_SIZE='1000000000'

    # HASURA_GRAPHQL_CACHE_MAX_ENTRY_SIZE
    # Maximum cache entry size in MB. Default 1000 MB
    HASURA_GRAPHQL_CACHE_MAX_ENTRY_SIZE='1000'

    # HASURA_GRAPHQL_CACHE_MAX_ENTRY_TTL
    # Maximum Query Cache TTL value in seconds. See
    # https://hasura.io/docs/latest/queries/response-caching/ for more info. Default: 3600
    # seconds
    HASURA_GRAPHQL_CACHE_MAX_ENTRY_TTL='3600'

    # HASURA_GRAPHQL_MAX_CACHE_SIZE
    # Deprecated alias for query response cache entry size. Prefer
    # `HASURA_GRAPHQL_CACHE_MAX_ENTRY_SIZE`.
    # HASURA_GRAPHQL_MAX_CACHE_SIZE=


    # --- Pro/EE ---
    # HASURA_GRAPHQL_EE_LICENSE_KEY
    # Hasura Enterprise Edition license key (secret). Prefer mounting via a Kubernetes Secret or
    # Vault, not a ConfigMap.
    # HASURA_GRAPHQL_EE_LICENSE_KEY=

    # HASURA_GRAPHQL_EE_LICENSE_KEY_PATH
    # Path to a file containing the Hasura Enterprise Edition license key.
    # HASURA_GRAPHQL_EE_LICENSE_KEY_PATH=

    # HASURA_GRAPHQL_PROJECT_CONFIG
    # Project configuration for Hasura Enterprise Edition
    # HASURA_GRAPHQL_PROJECT_CONFIG=

    # HASURA_GRAPHQL_PRO_ENDPOINT
    # The pro endpoint for authorization and collect metrics
    # HASURA_GRAPHQL_PRO_ENDPOINT=

    # HASURA_GRAPHQL_PRO_KEY
    # The pro key that you have received
    # HASURA_GRAPHQL_PRO_KEY=

    # HASURA_GRAPHQL_SSO_PROVIDERS
    # Single sign-on provider configuration (JSON array). Treat as sensitive if it contains
    # client secrets.
    # HASURA_GRAPHQL_SSO_PROVIDERS=


    # --- Lux ---
    # LUX_AUTH_ISSUER
    # Issuer used for Lux authentication (Pro/EE).
    # LUX_AUTH_ISSUER=

    # LUX_LOG_SEND_INTERVAL
    # Interval (seconds) at which logs are sent to Lux (Pro/EE).
    # LUX_LOG_SEND_INTERVAL=

    # LUX_LOG_SINK_URL
    # Lux log sink URL (Pro/EE).
    # LUX_LOG_SINK_URL=

    # LUX_METRICS_URL
    # Lux metrics server URL (Pro/EE).
    # LUX_METRICS_URL=

    # LUX_OAUTH_AUTHORIZATION_URL
    # OAuth authorization URL used for Lux auth (Pro/EE).
    # LUX_OAUTH_AUTHORIZATION_URL=

    # LUX_OAUTH_JWK_URL
    # OAuth JWK URL used for Lux auth (Pro/EE).
    # LUX_OAUTH_JWK_URL=

    # LUX_OAUTH_TOKEN_URL
    # OAuth token URL used for Lux auth (Pro/EE).
    # LUX_OAUTH_TOKEN_URL=

    # LUX_SCHEME
    # Lux scheme/identifier used by the Hasura Pro/EE telemetry client.
    # LUX_SCHEME=

    # LUX_TLS_INSECURE_ALLOWLIST
    # TLS AllowList for self-signed certificates to support infrastructure services such as Lux.
    # LUX_TLS_INSECURE_ALLOWLIST=

    # LUX_VALIDATE_PAT_URL
    # Endpoint used to validate personal access tokens for Lux auth (Pro/EE).
    # LUX_VALIDATE_PAT_URL=


    # --- Other ---
    # HASURA_GRAPHQL_ACCESS_KEY
    # Admin secret key, required to access this instance (deprecated: use
    # HASURA_GRAPHQL_ADMIN_SECRET instead)
    # HASURA_GRAPHQL_ACCESS_KEY=

    # HASURA_GRAPHQL_CLOSE_WEBSOCKETS_ON_METADATA_CHANGE
    # Close all the websocket connections (with error code 1012) on metadata change (default:
    # true).
    HASURA_GRAPHQL_CLOSE_WEBSOCKETS_ON_METADATA_CHANGE='true'

    # HASURA_GRAPHQL_DYNAMIC_SECRETS_ALLOWED_PATH_PREFIX
    # Allowed path prefix for dynamic secret references. Used to restrict which filesystem paths
    # may be read when using `dynamic-from-file://...` style configuration values.
    # HASURA_GRAPHQL_DYNAMIC_SECRETS_ALLOWED_PATH_PREFIX=

    # HASURA_GRAPHQL_ENABLED_APIS
    # Comma separated list of enabled APIs. (default: metadata,graphql,pgdump,config)
    HASURA_GRAPHQL_ENABLED_APIS='metadata,graphql,pgdump,config'

    # HASURA_GRAPHQL_METADATA_DEFAULTS
    # Default metadata behavior/settings applied by the server. This setting is version/feature
    # dependent; consult Hasura docs for the expected JSON/YAML structure for your version.
    # HASURA_GRAPHQL_METADATA_DEFAULTS=

    # HASURA_GRAPHQL_METRICS_ENABLE_HIGH_CARDINALITY_LABELS
    # Enable high-cardinality labels for Prometheus metrics (Default: true)
    HASURA_GRAPHQL_METRICS_ENABLE_HIGH_CARDINALITY_LABELS='true'

    # HASURA_GRAPHQL_METRICS_SECRET
    # Secret/token used to protect metrics endpoints where supported. Treat this as sensitive
    # and provide via Secret/Vault.
    # HASURA_GRAPHQL_METRICS_SECRET=

    # HASURA_GRAPHQL_PERSISTED_QUERIES_TTL
    # TTL for queries in the cache store (default: 5 seconds).
    HASURA_GRAPHQL_PERSISTED_QUERIES_TTL='5'

    # HASURA_GRAPHQL_QUERY_PLAN_CACHE_SIZE
    # Deprecated/legacy query plan cache size setting. Newer versions may ignore this value;
    # consult the server help/docs for your version.
    # HASURA_GRAPHQL_QUERY_PLAN_CACHE_SIZE=
