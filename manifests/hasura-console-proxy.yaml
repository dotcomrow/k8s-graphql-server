apiVersion: v1
kind: ServiceAccount
metadata:
  name: hasura-console-proxy
  namespace: graphql
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hasura-console-nginx
  namespace: graphql
data:
  hasura-console.conf.template: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    server {
      listen 8081;
      server_name _;
      location / {
        proxy_pass http://hasura.graphql.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Hasura-Admin-Secret ${HASURA_ADMIN_SECRET};
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasura-console-proxy
  namespace: graphql
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hasura-console-proxy
  template:
    metadata:
      labels:
        app: hasura-console-proxy
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "graphql-console"
        vault.hashicorp.com/agent-inject-secret-oauth2.cfg: "secret/data/keycloak-client-id-hasura-console-proxy"
        vault.hashicorp.com/agent-inject-template-oauth2.cfg: |
          {{ with secret "secret/data/keycloak-client-id-hasura-console-proxy" }}
          client_id = "{{ .Data.data.value }}"
          {{ end }}
          {{ with secret "secret/data/keycloak-client-secret-hasura-console-proxy" }}
          client_secret = "{{ .Data.data.value }}"
          {{ end }}
          {{ with secret "secret/data/hasura-console-oauth2-proxy-cookie-secret" }}
          cookie_secret = "{{ .Data.data.value }}"
          {{ end }}
          {{ with secret "secret/data/redis" }}
          {{- $raw := .Data.data.password -}}
          {{- $enc := $raw | replace "%" "%25" | replace "@" "%40" | replace ":" "%3A" | replace "/" "%2F" | replace "+" "%2B" -}}
          redis_connection_url = "redis://:{{ $enc }}@redis-0.redis-headless.redis.svc.cluster.local:6379/0"
          {{ end }}
        vault.hashicorp.com/agent-inject-secret-hasura-admin: "secret/data/graphql/hasura-admin"
        vault.hashicorp.com/agent-inject-template-hasura-admin: |
          {{- with secret "secret/data/graphql/hasura-admin" -}}
          {{- if .Data.data.admin_secret -}}
          {{ .Data.data.admin_secret }}
          {{- else -}}
          {{ .Data.data.value }}
          {{- end -}}
          {{- end -}}
    spec:
      serviceAccountName: hasura-console-proxy
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          ports:
            - containerPort: 4180
          args:
            - --config=/vault/secrets/oauth2.cfg
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.suncoast.systems/realms/internal
            - --redirect-url=https://graphql-gui.teleport.app.suncoast.systems/oauth2/callback
            - --whitelist-domain=graphql-gui.teleport.app.suncoast.systems
            - --whitelist-domain=teleport.app.suncoast.systems
            - --cookie-domain=.teleport.app.suncoast.systems
            - --upstream=http://127.0.0.1:8081
            - --email-domain=*
            - --insecure-oidc-allow-unverified-email=true
            - --scope=openid profile email groups
            - --allowed-role=hasura_admins
            - --pass-access-token=true
            - --set-authorization-header=true
            - --pass-authorization-header=true
            - --set-xauthrequest=true
            - --proxy-websockets=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-refresh=1h
            - --cookie-expire=8h
            - --session-store-type=redis
            - --reverse-proxy=true
            - --http-address=0.0.0.0:4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: hasura-console-upstream
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8081
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              secret="$(cat /vault/secrets/hasura-admin)"
              escaped="$(printf '%s' "$secret" | sed 's/[$]/\\$&/g')"
              export HASURA_ADMIN_SECRET="$escaped"
              envsubst '$HASURA_ADMIN_SECRET' < /etc/nginx/templates/hasura-console.conf.template > /etc/nginx/conf.d/default.conf
              exec nginx -g 'daemon off;'
          volumeMounts:
            - name: hasura-console-nginx
              mountPath: /etc/nginx/templates
      volumes:
        - name: hasura-console-nginx
          configMap:
            name: hasura-console-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: hasura-console
  namespace: graphql
  annotations:
    teleport.dev/name: "hasura-console"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "graphql-gui.teleport.app.suncoast.systems"
    teleport.dev/description: "Hasura Console - GraphQL admin UI"
    teleport.dev/port: "4180"
  labels:
    teleport.dev/app: "hasura-console"
    teleport.dev/enroll: "true"
spec:
  selector:
    app: hasura-console-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
