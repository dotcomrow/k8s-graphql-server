apiVersion: v1
kind: ServiceAccount
metadata:
  name: hasura
  namespace: graphql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasura
  namespace: graphql
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hasura
  template:
    metadata:
      labels:
        app: hasura
      annotations:
        reloader.stakater.com/auto: "true"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "graphql"
        vault.hashicorp.com/agent-inject-secret-hasura-admin: "secret/data/graphql/hasura-admin"
        vault.hashicorp.com/agent-inject-template-hasura-admin: |
          {{- with secret "secret/data/graphql/hasura-admin" -}}
          {{- if .Data.data.admin_secret -}}
          {{ .Data.data.admin_secret }}
          {{- else -}}
          {{ .Data.data.value }}
          {{- end -}}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-db-url: "yugabyte-db/static-creds/graphql-yb-admin"
        vault.hashicorp.com/agent-inject-template-db-url: |
          {{- with secret "yugabyte-db/static-creds/graphql-yb-admin" -}}
          postgresql://{{ .Data.username }}:{{ .Data.password }}@yb-tserver-service.yugabyte.svc.cluster.local:5433/hasura?sslmode=disable
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-graphql-api-client-id: "secret/data/keycloak-client-id-graphql-api"
        vault.hashicorp.com/agent-inject-template-graphql-api-client-id: |
          {{- with secret "secret/data/keycloak-client-id-graphql-api" -}}
          {{ .Data.data.value }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-redis-url: "secret/data/redis"
        vault.hashicorp.com/agent-inject-template-redis-url: |
          {{- with secret "secret/data/redis" -}}
          {{- $raw := .Data.data.password -}}
          {{- $enc := $raw | urlquery -}}
          redis://:{{ $enc }}@redis-0.redis-headless.redis.svc.cluster.local:6379/2
          {{- end }}
        linkerd.io/inject: "enabled"
    spec:
      serviceAccountName: hasura
      containers:
        - name: hasura
          image: hasura/graphql-engine:v2.38.0
          ports:
            - containerPort: 8080
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              load_env_defaults() {
                path="$1"
                [ -f "$path" ] || return 0
                # Load VAR=... assignments from $path but do NOT override env vars
                # already set on the container (e.g. via the Deployment manifest).
                while IFS= read -r line || [ -n "$line" ]; do
                  case "$line" in
                    ''|\#*) continue ;;
                    export\ *) line="${line#export }" ;;
                  esac
                  case "$line" in
                    [A-Z_][A-Z0-9_]*=*)
                      var="${line%%=*}"
                      if eval "[ -n \"\${$var+x}\" ]"; then
                        continue
                      fi
                      eval "export $line"
                      ;;
                  esac
                done < "$path"
              }
              load_env_defaults /etc/hasura/hasura.env
              wait_for_file() {
                path="$1"
                while [ ! -s "$path" ]; do
                  echo "Waiting for $path..."
                  sleep 2
                done
              }
              wait_for_file /vault/secrets/db-url
              wait_for_file /vault/secrets/hasura-admin
              wait_for_file /vault/secrets/graphql-api-client-id
              if [ -z "${HASURA_GRAPHQL_REDIS_URL+x}" ]; then
                wait_for_file /vault/secrets/redis-url
              fi

              read_secrets() {
                db="$(cat /vault/secrets/db-url)"
                admin="$(cat /vault/secrets/hasura-admin)"
                graphql_aud="$(tr -d '\r\n' < /vault/secrets/graphql-api-client-id)"
                redis_url=""
                if [ -z "${HASURA_GRAPHQL_REDIS_URL+x}" ] && [ -s /vault/secrets/redis-url ]; then
                  redis_url="$(cat /vault/secrets/redis-url)"
                fi
                if [ -z "${graphql_aud:-}" ]; then
                  echo "graphql api client id is empty"
                  exit 1
                fi
              }

              build_jwt_secrets() {
                internal_jwk="https://auth.suncoast.systems/realms/internal/protocol/openid-connect/certs"
                internal_issuer="https://auth.suncoast.systems/realms/internal"
                internal_aud="hasura-console-proxy"
                external_jwk="https://auth.suncoast.systems/realms/external/protocol/openid-connect/certs"
                external_issuer="https://auth.suncoast.systems/realms/external"
                claims_path='$["https://hasura"]["io/jwt/claims"]'
                json_escape() {
                  printf '%s' "$1" | sed 's/\\/\\\\/g; s/\"/\\\"/g'
                }
                claims_path_escaped="$(json_escape "$claims_path")"
                internal_json=$(printf '{"type":"RS256","jwk_url":"%s","issuer":"%s","audience":"%s","claims_namespace_path":"%s"}' \
                  "$internal_jwk" "$internal_issuer" "$internal_aud" "$claims_path_escaped")
                external_json=$(printf '{"type":"RS256","jwk_url":"%s","issuer":"%s","audience":"%s","claims_namespace_path":"%s"}' \
                  "$external_jwk" "$external_issuer" "$graphql_aud" "$claims_path_escaped")
                export HASURA_GRAPHQL_JWT_SECRETS="[$internal_json,$external_json]"
              }

              start_hasura() {
                graphql-engine serve &
                HASURA_PID=$!
              }

              read_secrets
              last_db="$db"
              last_admin="$admin"
              last_graphql_aud="$graphql_aud"
              last_redis_url="$redis_url"
              export HASURA_GRAPHQL_DATABASE_URL="$last_db"
              export HASURA_GRAPHQL_ADMIN_SECRET="$last_admin"
              if [ -z "${HASURA_GRAPHQL_REDIS_URL+x}" ] && [ -n "${redis_url:-}" ]; then
                export HASURA_GRAPHQL_REDIS_URL="$redis_url"
              fi
              if [ -n "${HASURA_GRAPHQL_AUTH_HOOK:-}" ]; then
                unset HASURA_GRAPHQL_JWT_SECRETS
              else
                build_jwt_secrets
              fi
              start_hasura

              while :; do
                read_secrets
                if [ "$db" != "$last_db" ] || [ "$admin" != "$last_admin" ] || [ "$graphql_aud" != "$last_graphql_aud" ] || [ "${redis_url:-}" != "${last_redis_url:-}" ]; then
                  last_db="$db"
                  last_admin="$admin"
                  last_graphql_aud="$graphql_aud"
                  last_redis_url="$redis_url"
                  export HASURA_GRAPHQL_DATABASE_URL="$last_db"
                  export HASURA_GRAPHQL_ADMIN_SECRET="$last_admin"
                  if [ -z "${HASURA_GRAPHQL_REDIS_URL+x}" ] && [ -n "${redis_url:-}" ]; then
                    export HASURA_GRAPHQL_REDIS_URL="$redis_url"
                  fi
                  if [ -n "${HASURA_GRAPHQL_AUTH_HOOK:-}" ]; then
                    unset HASURA_GRAPHQL_JWT_SECRETS
                  else
                    build_jwt_secrets
                  fi
                  if kill -0 "$HASURA_PID" 2>/dev/null; then
                    kill -TERM "$HASURA_PID"
                    wait "$HASURA_PID" || true
                  fi
                  start_hasura
                elif ! kill -0 "$HASURA_PID" 2>/dev/null; then
                  start_hasura
                fi
                sleep 10
              done
          volumeMounts:
            - name: hasura-config
              mountPath: /etc/hasura
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: hasura-config
          configMap:
            name: hasura-config
            items:
              - key: hasura.env
                path: hasura.env
---
apiVersion: v1
kind: Service
metadata:
  name: hasura
  namespace: graphql
spec:
  selector:
    app: hasura
  ports:
    - name: http
      port: 8080
      targetPort: 8080
