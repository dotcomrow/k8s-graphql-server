apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-cloudflare-tunnel-token
  namespace: openobserve
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-store-openobserve
  target:
    name: openobserve-cloudflare-tunnel-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: value
      remoteRef:
        # Vault KVv2 path: secret/data/openobserve-cloudflare-tunnel-token
        key: openobserve-cloudflare-tunnel-token
        property: value
