apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-rum-proxy-auth
  namespace: openobserve
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-store-openobserve
  target:
    name: oo-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: OO_AUTH_HEADER
      remoteRef:
        # Vault KVv2 path: secret/data/openobserve-rum-proxy
        key: openobserve-rum-proxy
        property: OO_AUTH_HEADER

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-rum-proxy-hmac
  namespace: openobserve
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault-store-openobserve
  target:
    name: oo-auth-bridge
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: hmac_secret
      remoteRef:
        # Vault KVv2 path: secret/data/openobserve-rum-proxy
        key: openobserve-rum-proxy
        property: hmac_secret
