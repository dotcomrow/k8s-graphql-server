apiVersion: v1
kind: ConfigMap
metadata:
  name: openobserve-rum-proxy
  namespace: openobserve
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: openobserve-rum-proxy
data:
  openobserve-rum-proxy.py: |
    #!/usr/bin/env python3
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    import base64
    import hashlib
    import hmac
    import json
    import os
    import time
    import urllib.error
    import urllib.request
    from collections import deque, defaultdict
    import ast
    from urllib.parse import urlparse, urlunparse
    from typing import Dict, Tuple

    REQUIRED_HEADERS = ("x-rum-timestamp", "x-rum-signature")
    RUM_NATIVE_TRACK_TYPES = {"rum", "logs", "replay", "profile"}
    RUM_RAW_NATIVE_TRACK_TYPES = {"replay", "profile"}
    RUM_PATH_CANONICAL_MAP = {
      "/v1/rum": [
        "/v1/rum",
        "/v1/rum/_json",
        "/rum/v1/default/rum",
        "/rum/v1/default/rum/_json",
        "/v1/default/rum",
        "/v1/default/rum/_json",
        "/api/default/rum",
        "/api/default/rum/_json",
        "/api/default/v1/rum",
        "/api/log/events/v1/rum",
        "/api/log/events/v1/rum/_json",
        "/api/v1/rum/_json",
      ],
      "/v1/logs": [
        "/v1/logs",
        "/v1/logs/_json",
        "/rum/v1/default/logs",
        "/rum/v1/default/logs/_json",
        "/v1/default/logs",
        "/v1/default/logs/_json",
        "/api/default/logs",
        "/api/default/logs/_json",
        "/api/default/v1/logs",
        "/api/log/events/v1/logs",
        "/api/log/events/v1/logs/_json",
        "/api/v1/logs/_json",
      ],
    }

    def _env(name: str, default: str) -> str:
        return os.getenv(name, default)

    def _normalize_path(value: str) -> str:
        return (value or "/").split("?", 1)[0].rstrip("/") or "/"

    def _parse_native_rum_path(path: str) -> Tuple[str, str, str]:
        normalized_path = _normalize_path(urlparse(path).path)
        parts = normalized_path.strip("/").split("/")
        if (
            len(parts) == 4
            and parts[0] == "rum"
            and parts[1].startswith("v")
            and parts[2]
            and parts[3] in RUM_NATIVE_TRACK_TYPES
        ):
            return normalized_path, parts[2], parts[3]
        return "", "", ""

    def _native_track_type(path: str) -> str:
        _, _, track_type = _parse_native_rum_path(path)
        return track_type

    def _is_raw_native_path(path: str) -> bool:
        return _native_track_type(path) in RUM_RAW_NATIVE_TRACK_TYPES

    def _canonical_path(path: str) -> str:
        normalized_path = _normalize_path(path)
        native_path, _, track_type = _parse_native_rum_path(normalized_path)
        if native_path:
            if track_type == "rum":
                return "/v1/rum"
            if track_type == "logs":
                return "/v1/logs"
            if track_type in RUM_RAW_NATIVE_TRACK_TYPES:
                return native_path
        for canonical, aliases in RUM_PATH_CANONICAL_MAP.items():
            if normalized_path in aliases:
                return canonical
            for alias in aliases:
                if normalized_path.endswith(alias):
                    return canonical
        return normalized_path if normalized_path in ("/v1/rum", "/v1/logs") else ""

    def _required_headers(path: str) -> Tuple[str, str]:
        if path == "/v1/logs":
            headers = tuple(
                value.strip()
                for value in _env("LOG_REQUIRED_HEADERS", "x-rum-timestamp,x-rum-signature").split(",")
                if value.strip()
            )
            if len(headers) == 2:
                return headers[0], headers[1]
            return ("x-rum-timestamp", "x-rum-signature")
        return REQUIRED_HEADERS

    LISTEN_HOST = _env("APP_LISTEN_HOST", "0.0.0.0")
    LISTEN_PORT = int(_env("APP_LISTEN_PORT", "8080"))
    UPSTREAM_BASE = _env("OPENOBSERVE_UPSTREAM_BASE", "http://openobserve-router.openobserve.svc.cluster.local:5080")
    UPSTREAM_PATH = _env("OPENOBSERVE_RUM_PATH", "/api/default/rum")
    UPSTREAM_LOGS_PATH = _env("OPENOBSERVE_LOGS_PATH", "/api/default/logs")
    ALLOWED_ORIGINS = [
        value.strip().lower()
        for value in _env("ALLOWED_ORIGINS", "*.suncoast.systems").split(",")
        if value.strip()
    ]
    TIMESTAMP_TTL_SECONDS = int(_env("RUM_TIMESTAMP_TTL_SECONDS", "300"))
    MAX_PAYLOAD_BYTES = int(_env("OPENOBSERVE_MAX_PAYLOAD_BYTES", "1048576"))
    RUM_SECRET = _env("RUM_SECRET", "")
    if not RUM_SECRET:
        RUM_SECRET = _env("RUM_SECRET_FALLBACK", "")
    UPSTREAM_TOKEN = _env("OPENOBSERVE_API_TOKEN", "")
    AUTH_HEADER_NAME = _env("OPENOBSERVE_AUTH_HEADER_NAME", "Authorization")
    AUTH_HEADER_SCHEME = _env("OPENOBSERVE_AUTH_HEADER_SCHEME", "Bearer")
    UPSTREAM_AUTH_HEADER = _env("OPENOBSERVE_AUTH_HEADER", "").strip()
    ALLOW_NO_ORIGIN = _env("RUM_ALLOW_NO_ORIGIN", "false").lower() in ("1", "true", "yes")
    REPLAY_CACHE_SECONDS = int(_env("RUM_REPLAY_CACHE_SECONDS", "60"))
    RUM_RATE_LIMIT_WINDOW_SECONDS = int(_env("RUM_RATE_LIMIT_WINDOW_SECONDS", "60"))
    RUM_RATE_LIMIT_MAX_REQUESTS = int(_env("RUM_RATE_LIMIT_MAX_REQUESTS", "120"))
    LOG_RATE_LIMIT_WINDOW_SECONDS = int(_env("LOG_RATE_LIMIT_WINDOW_SECONDS", "60"))
    LOG_RATE_LIMIT_MAX_REQUESTS = int(_env("LOG_RATE_LIMIT_MAX_REQUESTS", "180"))
    REPLAY_CACHE: Dict[str, float] = {}
    RATE_LIMIT_CACHE: Dict[str, deque] = defaultdict(deque)


    def _json_error(status: int, message: str, detail: str = "") -> Tuple[bytes, int]:
        payload = {"error": message}
        if detail:
            payload["detail"] = detail
        raw = json.dumps(payload).encode()
        return raw, status


    def _parse_host(value: str) -> str:
        if not value:
            return ""
        parsed = urlparse(value)
        host = parsed.hostname or value
        return host.lower().strip()


    def _is_allowed_origin(host: str) -> bool:
        if not ALLOWED_ORIGINS:
            return True
        if not host:
            return False
        for item in ALLOWED_ORIGINS:
            if not item:
                continue
            if item.startswith("*."):
                base = item[2:]
                if host == base or host.endswith(f".{base}"):
                    return True
                continue
            if host == item or host.endswith(f".{item}"):
                return True
        return False


    def _verify_signature(ts: str, body: bytes, signature: str) -> bool:
        if not RUM_SECRET:
            return False
        try:
            ts_int = int(ts)
        except ValueError:
            return False
        current = int(time.time())
        if abs(current - ts_int) > TIMESTAMP_TTL_SECONDS:
            return False
        canonical = ts.encode() + b"|" + body
        expected = hmac.new(RUM_SECRET.encode(), canonical, hashlib.sha256).digest()
        expected_signature = base64.urlsafe_b64encode(expected).decode().rstrip("=")
        return hmac.compare_digest(signature, expected_signature)


    def _is_replay(signature: str) -> bool:
        if REPLAY_CACHE_SECONDS <= 0:
            return False
        now = time.time()
        if signature in REPLAY_CACHE and now - REPLAY_CACHE[signature] < REPLAY_CACHE_SECONDS:
            return True
        REPLAY_CACHE[signature] = now
        expired = [key for key, value in REPLAY_CACHE.items() if now - value >= REPLAY_CACHE_SECONDS]
        for key in expired:
            del REPLAY_CACHE[key]
        return False


    def _is_rate_limited(path: str, client: str) -> bool:
        if client:
            key = f"{path}|{client}"
        else:
            key = path

        if path == "/v1/logs":
            window_seconds = LOG_RATE_LIMIT_WINDOW_SECONDS
            max_requests = LOG_RATE_LIMIT_MAX_REQUESTS
        else:
            window_seconds = RUM_RATE_LIMIT_WINDOW_SECONDS
            max_requests = RUM_RATE_LIMIT_MAX_REQUESTS

        if window_seconds <= 0 or max_requests <= 0:
            return False

        bucket = RATE_LIMIT_CACHE[key]
        now = time.time()
        cutoff = now - window_seconds
        while bucket and bucket[0] < cutoff:
            bucket.popleft()

        if len(bucket) >= max_requests:
            return True

        bucket.append(now)
        return False


    def _upstream_path(path: str) -> str:
        if _is_raw_native_path(path):
            return path
        if path == "/v1/logs":
            return UPSTREAM_LOGS_PATH
        return UPSTREAM_PATH


    def _upstream_target(path: str, canonical_path: str) -> str:
        parsed_base = urlparse(UPSTREAM_BASE)
        parsed_request = urlparse(path)
        return urlunparse(
            parsed_base._replace(
                path=_upstream_path(canonical_path),
                params="",
                query=parsed_request.query,
                fragment="",
            )
        )


    def _decode_json_values(decoded_body: str) -> list:
        if not decoded_body:
            return []
        decoder = json.JSONDecoder()
        values = []
        index = 0
        length = len(decoded_body)

        try:
            while index < length:
                while index < length and decoded_body[index].isspace():
                    index += 1
                if index >= length:
                    break
                value, index = decoder.raw_decode(decoded_body, index)
                if isinstance(value, tuple):
                    value = list(value)
                if not isinstance(value, (dict, list, tuple)):
                    raise TypeError("top-level JSON value must be an object or array")
                if not value:
                    raise ValueError("top-level JSON object/array is empty")
                values.append(value)

                while index < length and decoded_body[index].isspace():
                    index += 1
                if index < length and decoded_body[index] == ",":
                    index += 1
                while index < length and decoded_body[index].isspace():
                    index += 1
            return values
        except json.JSONDecodeError as exc:
            # Fallback for non-strict or Python-literal payload fragments (e.g. line-based exports).
            values = []
            for raw_line in decoded_body.splitlines():
                line = raw_line.strip().rstrip(",").rstrip(";").strip()
                if not line:
                    continue
                parsed = None
                try:
                    parsed = json.loads(line)
                except json.JSONDecodeError:
                    try:
                        parsed = ast.literal_eval(line)
                    except (SyntaxError, ValueError):
                        raise exc
                if isinstance(parsed, tuple):
                    parsed = list(parsed)
                if isinstance(parsed, (list, tuple)):
                    values.extend(_flatten_records([parsed] if isinstance(parsed, tuple) else parsed))
                    continue
                if isinstance(parsed, dict):
                    values.append(parsed)
                    continue
                raise TypeError("top-level JSON value must be an object or array")
            return values


    def _coerce_scalar(value):
        if isinstance(value, (str, int, float, bool)) or value is None:
            return value
        if isinstance(value, (dict, list, tuple)):
            return json.dumps(value, separators=(",", ":"))
        return str(value)


    def _coerce_record(record: dict) -> dict:
        if not isinstance(record, dict):
            return {"value": _coerce_scalar(record)}
        return {str(key): _coerce_scalar(value) for key, value in record.items()}


    def _flatten_records(values: list) -> list[dict]:
        records: list[dict] = []
        for value in values:
            if isinstance(value, tuple):
                value = list(value)
            if isinstance(value, dict):
                records.append(_coerce_record(value))
                continue
            if isinstance(value, (list, tuple)):
                if not value:
                    raise ValueError("top-level array value is empty")
                for nested in value:
                    nested_records = _flatten_records([nested])
                    records.extend(nested_records)
                continue
            raise TypeError(f"top-level JSON value must be an object or array, got {type(value).__name__}")
        return records


    def _normalize_payload(body: bytes, content_type: str) -> Tuple[bool, bytes, str, str]:
        if not body:
            return False, b"", "application/json", "empty payload"

        content_type = (content_type or "").split(";", 1)[0].strip().lower()
        if content_type and content_type not in ("application/json", "application/x-ndjson", "text/plain"):
            return False, b"", "application/json", f"unsupported content type '{content_type}'"

        decoded = body.decode("utf-8", errors="ignore").strip()
        if not decoded:
            return False, b"", "application/json", "empty payload"

        try:
            values = _decode_json_values(decoded)
        except (TypeError, ValueError, json.JSONDecodeError) as exc:
            return False, b"", "application/json", f"payload is not valid JSON ({exc})"
        if not values:
            return False, b"", "application/json", "payload has no JSON values"

        try:
            records = _flatten_records(values)
        except (TypeError, ValueError) as exc:
            return False, b"", "application/json", f"payload shape invalid ({exc})"

        # /api/{org}/{stream}/_json ingesters expect JSON-array batches.
        if not records:
            return False, b"", "application/json", "payload has no records after normalization"

        normalized_body = json.dumps(records, separators=(",", ":")).encode("utf-8")
        normalized_content_type = "application/json"
        return True, normalized_body, normalized_content_type, ""


    def _normalize_raw_native_payload(body: bytes, content_type: str, path: str) -> Tuple[bool, bytes, str, str]:
        if not body:
            return False, b"", "application/json", "empty payload"

        content_type = (content_type or "").strip()
        normalized_content_type = content_type.split(";", 1)[0].strip().lower()
        track_type = _native_track_type(path)
        if track_type in RUM_RAW_NATIVE_TRACK_TYPES and normalized_content_type != "multipart/form-data":
            return False, b"", "application/json", f"unsupported content type '{normalized_content_type}'"

        return True, body, content_type or "application/octet-stream", ""


    def _rewrap_batch(body: bytes) -> bytes:
        if not body:
            return body
        try:
            decoded = body.decode("utf-8")
        except UnicodeDecodeError:
            return body
        try:
            values = _decode_json_values(decoded)
            records = _flatten_records(values)
            rewritten = json.dumps([_coerce_record(r) for r in records], separators=(",", ":")).encode("utf-8")
            return rewritten
        except (TypeError, ValueError, json.JSONDecodeError):
            return body


    def _is_trailing_error(body: bytes) -> bool:
        if not body:
            return False
        text = body.decode("utf-8", errors="ignore").lower()
        return "trailing characters at line" in text


    def _send_to_upstream(target: str, body: bytes, headers: Dict[str, str], content_type: str) -> Tuple[int, bytes, Dict[str, str]]:
        request = urllib.request.Request(target, data=body, method="POST")
        for key, value in headers.items():
            key_lower = key.lower()
            if key_lower.startswith("x-rum-"):
                continue
            if key_lower in (
                "content-length",
                "authorization",
                "proxy-authorization",
                "connection",
                "proxy-connection",
                "transfer-encoding",
                "keep-alive",
                "te",
                "trailer",
                "upgrade",
            ):
                continue
            request.add_header(key, value)
        if UPSTREAM_AUTH_HEADER:
            request.add_header(AUTH_HEADER_NAME, UPSTREAM_AUTH_HEADER)
        elif UPSTREAM_TOKEN:
            request.add_header(AUTH_HEADER_NAME, f"{AUTH_HEADER_SCHEME} {UPSTREAM_TOKEN}".strip())
        else:
            raise RuntimeError("Proxy upstream auth is not configured.")
        request.add_header("Content-Type", content_type or headers.get("Content-Type", "application/json"))

        try:
            response = urllib.request.urlopen(request, timeout=10)
            status = response.getcode()
            data = response.read()
            return status, data, dict(response.headers)
        except urllib.error.HTTPError as error:
            return error.code, error.read(), dict(error.headers)
        except Exception as error:
            raise error

    def _forward(body: bytes, headers: Dict[str, str], path: str, content_type: str) -> Tuple[int, bytes, Dict[str, str]]:
        canonical_path = _canonical_path(path)
        target = _upstream_target(path, canonical_path)
        if _is_raw_native_path(canonical_path):
            return _send_to_upstream(target, body, headers, content_type)

        normalized_body = _rewrap_batch(body)
        status, upstream_body, upstream_headers = _send_to_upstream(target, normalized_body, headers, content_type)
        if status == 400 and _is_trailing_error(upstream_body):
            fallback_body = _rewrap_batch(normalized_body)
            if fallback_body != normalized_body:
                status, upstream_body, upstream_headers = _send_to_upstream(target, fallback_body, headers, content_type)
        return status, upstream_body, upstream_headers


    class RUMProxyHandler(BaseHTTPRequestHandler):
        server_version = "openobserve-rum-proxy/1.0"

        def log_message(self, format: str, *args) -> None:  # pragma: no cover - container logging
            return

        def _client_ip(self) -> str:
            forward = self.headers.get("X-Forwarded-For")
            return (forward.split(",")[0].strip() if forward else self.client_address[0])

        def _allowed_client(self) -> Tuple[bool, bytes, str]:
            if self.path in ("/health", "/healthz"):
                return True, b"", "application/json"
            canonical_path = _canonical_path(self.path)
            if not canonical_path:
                return False, b'{"error":"not found"}', "application/json"
            if self.command != "POST":
                return False, b'{"error":"method not allowed"}', "application/json"
            required_headers = _required_headers(canonical_path)
            for header in required_headers:
                if not self.headers.get(header):
                    return False, b'{"error":"missing authentication headers"}', "application/json"
            if not RUM_SECRET:
                return False, b'{"error":"proxy secret not configured"}', "application/json"
            ts = self.headers.get(required_headers[0], "")
            signature = self.headers.get(required_headers[1], "")
            content_length = int(self.headers.get("Content-Length", "0"))
            if content_length > MAX_PAYLOAD_BYTES:
                return False, b'{"error":"payload too large"}', "application/json"
            body = self.rfile.read(content_length) if content_length > 0 else b""
            if _is_raw_native_path(canonical_path):
                valid_payload, normalized_body, normalized_content_type, payload_error = _normalize_raw_native_payload(
                    body,
                    self.headers.get("Content-Type", ""),
                    canonical_path,
                )
            else:
                valid_payload, normalized_body, normalized_content_type, payload_error = _normalize_payload(
                    body,
                    self.headers.get("Content-Type", ""),
                )
            if not valid_payload:
                return False, json.dumps({"error":"invalid payload", "detail": payload_error}).encode(), "application/json"
            if _is_rate_limited(canonical_path, self._client_ip()):
                return False, b'{"error":"rate limit exceeded"}', "application/json"
            if _is_replay(signature):
                return False, b'{"error":"replay blocked"}', "application/json"
            if not _verify_signature(ts, body, signature):
                return False, b'{"error":"invalid signature or stale timestamp"}', "application/json"
            origin_host = _parse_host(self.headers.get("Origin"))
            if not origin_host:
                origin_host = _parse_host(self.headers.get("Referer"))
            if not origin_host and not ALLOW_NO_ORIGIN:
                return False, b'{"error":"origin not provided"}', "application/json"
            if origin_host and not _is_allowed_origin(origin_host):
                return False, b'{"error":"origin blocked"}', "application/json"

            return True, normalized_body, normalized_content_type

        def _send(self, status: int, body: bytes, content_type: str = "application/json") -> None:
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            if body:
                self.wfile.write(body)

        def do_GET(self) -> None:
            if self.path in ("/health", "/healthz"):
                self._send(200, b'{"status":"ok"}')
                return
            self._send(404, b'{"error":"not found"}')

        def do_OPTIONS(self) -> None:
            self.send_response(204)
            self.send_header("Access-Control-Allow-Origin", self.headers.get("Origin", "*"))
            self.send_header("Access-Control-Allow-Headers", "Content-Type, x-rum-timestamp, x-rum-signature, x-log-timestamp, x-log-signature")
            self.send_header("Access-Control-Allow-Methods", "POST, OPTIONS")
            self.end_headers()

        def do_POST(self) -> None:
            allowed, body, upstream_content_type = self._allowed_client()
            if not allowed:
                if b'{' in body:
                    body_out = body
                    status = 403
                else:
                    body_out = b'{"error":"forbidden"}'
                    status = 403
                if body in (
                    b'{"error":"method not allowed"}',
                    b'{"error":"missing authentication headers"}',
                    b'{"error":"proxy secret not configured"}',
                    b'{"error":"invalid signature or stale timestamp"}',
                    b'{"error":"origin not provided"}',
                    b'{"error":"origin blocked"}',
                    b'{"error":"replay blocked"}',
                    b'{"error":"payload too large"}',
                ):
                    body_out = body
                    status = 403
                if body == b'{"error":"not found"}':
                    status = 404
                if body == b'{"error":"rate limit exceeded"}':
                    status = 429
                if body == b'{"error":"payload too large"}':
                    status = 413
                if body == b'{"error":"forbidden"}':
                    status = 403
                self._send(status, body_out)
                return

            try:
                upstream_status, upstream_body, upstream_headers = _forward(
                    body,
                    dict(self.headers),
                    self.path,
                    upstream_content_type,
                )
                self.send_response(upstream_status)
                self.send_header("Content-Type", upstream_headers.get("Content-Type", "application/json"))
                self.send_header("Content-Length", str(len(upstream_body)))
                self.send_header("Access-Control-Allow-Origin", self.headers.get("Origin", "*"))
                self.end_headers()
                if upstream_body:
                    self.wfile.write(upstream_body)
                print(f"{self._client_ip()} POST {self.path} upstream={upstream_status}")
            except Exception as error:
                self._send(502, json.dumps({"error": "upstream failure", "detail": str(error)}).encode())


    if __name__ == "__main__":
        server = ThreadingHTTPServer((LISTEN_HOST, LISTEN_PORT), RUMProxyHandler)
        server.serve_forever()

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openobserve-rum-proxy
  namespace: openobserve

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve-rum-proxy
  namespace: openobserve
  annotations:
    reloader.stakater.com/auto: "true"
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openobserve-rum-proxy
  template:
    metadata:
      labels:
        app: openobserve-rum-proxy
      annotations:
        reloader.stakater.com/auto: "true"
        # Keep this proxy out of the service mesh unless you intentionally need it there.
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: openobserve-rum-proxy
      containers:
        - name: rum-proxy
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /opt/openobserve-rum-proxy/openobserve-rum-proxy.py
          env:
            - name: APP_LISTEN_HOST
              value: "0.0.0.0"
            - name: APP_LISTEN_PORT
              value: "8080"
            - name: OPENOBSERVE_UPSTREAM_BASE
              value: "http://openobserve-router.openobserve.svc.cluster.local:5080"
            - name: OPENOBSERVE_RUM_PATH
              value: "/api/default/rum/_json"
            - name: OPENOBSERVE_LOGS_PATH
              value: "/api/default/logs/_json"
            - name: OPENOBSERVE_MAX_PAYLOAD_BYTES
              value: "4194304"
            - name: RUM_RATE_LIMIT_WINDOW_SECONDS
              value: "60"
            - name: RUM_RATE_LIMIT_MAX_REQUESTS
              value: "120"
            - name: LOG_RATE_LIMIT_WINDOW_SECONDS
              value: "60"
            - name: LOG_RATE_LIMIT_MAX_REQUESTS
              value: "240"
            - name: OPENOBSERVE_AUTH_HEADER_NAME
              value: "Authorization"
            - name: OPENOBSERVE_AUTH_HEADER_SCHEME
              value: "Bearer"
            - name: OPENOBSERVE_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: oo-auth
                  key: OO_AUTH_HEADER
                  optional: false
            - name: ALLOWED_ORIGINS
              value: "*.suncoast.systems"
            - name: RUM_TIMESTAMP_TTL_SECONDS
              value: "300"
            - name: RUM_REPLAY_CACHE_SECONDS
              value: "120"
            - name: RUM_ALLOW_NO_ORIGIN
              value: "false"
            - name: RUM_SECRET
              valueFrom:
                secretKeyRef:
                  name: oo-auth-bridge
                  key: hmac_secret
                  optional: false
          volumeMounts:
            - name: rum-proxy-code
              mountPath: /opt/openobserve-rum-proxy
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: rum-proxy-code
          configMap:
            name: openobserve-rum-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: openobserve-rum-proxy
  namespace: openobserve
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app: openobserve-rum-proxy
spec:
  selector:
    app: openobserve-rum-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
